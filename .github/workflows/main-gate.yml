name: Main Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, scratch/doubao-thread-reader]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    name: main-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Verify live entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'README.md',
              'NOW.md',
              'LICENSE',
              'CONTRIBUTING.md',
              'SECURITY.md',
              'releases/current/00-READ-ME-FIRST.md',
              'releases/current/CURRENT-BASELINE.yaml',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'missing required repository files: {missing}'
          print('live-entrypoints-pass')
          PY

      - name: Validate Current baseline pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root / 'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []):
              assert (root / rel).is_file(), f'missing core file: {rel}'
          lite = doc.get('lite_entrypoint')
          assert lite and (root / lite).is_file(), f'missing LITE entrypoint: {lite}'
          print('current-baseline-pointer-pass', doc.get('ena_version'), doc.get('adoption_status'))
          PY

      - name: Run compact Current semantic selftest
        run: python releases/current/tools/validate_contracts.py selftest

  scratch-doubao-fetch:
    if: github.ref == 'refs/heads/scratch/doubao-thread-reader'
    name: scratch-doubao-fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use runner Chrome with Playwright Core
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Fetch public Doubao thread
        env:
          THREAD_URL: https://www.doubao.com/thread/xDQe8KM1QaLE7DMq2
        run: |
          cat > fetch-thread.js <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH,
              args: ['--disable-blink-features=AutomationControlled', '--no-sandbox']
            });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });
            try {
              await page.goto(process.env.THREAD_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
              await page.locator('body').waitFor({ state: 'visible', timeout: 15000 });
              const title = (await page.title().catch(() => '')).trim();
              const text = (await page.locator('body').innerText({ timeout: 15000 })).trim();
              fs.writeFileSync('doubao-thread.txt', `TITLE: ${title}\nURL: ${process.env.THREAD_URL}\n\n${text}`, 'utf8');
              console.log(`FETCH_OK title=${JSON.stringify(title)} chars=${text.length}`);
              console.log('---THREAD_BEGIN---');
              console.log(text);
              console.log('---THREAD_END---');
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node fetch-thread.js

      - name: Upload thread text
        uses: actions/upload-artifact@v4
        with:
          name: doubao-thread-xdqe8
          path: doubao-thread.txt
          if-no-files-found: error

name: Main Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    name: main-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Verify public repository baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'README.md',
              'LICENSE',
              'CONTRIBUTING.md',
              'SECURITY.md',
              'PROJECT-HUB.md',
              'releases/current/00-READ-ME-FIRST.md',
              'releases/current/CURRENT-BASELINE.yaml',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'missing required repository files: {missing}'
          print('public-repository-baseline-pass')
          PY

      - name: Parse Current schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('releases/current/schemas').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print('schema-parse-pass', path)
          PY

      - name: Run Current semantic selftest
        run: python releases/current/tools/validate_contracts.py selftest

      - name: Validate Current baseline pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root / 'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []):
              assert (root / rel).is_file(), f'missing core file: {rel}'
          lite = doc.get('lite_entrypoint')
          assert lite and (root / lite).is_file(), f'missing LITE entrypoint: {lite}'
          print('current-baseline-pointer-pass', doc.get('ena_version'), doc.get('status'))
          PY

      - name: Explain research validation separation
        run: |
          echo 'Research validation remains path-scoped in har-validate.yml.'
          echo 'This always-on gate must not inherit unrelated pre-existing research drift.'

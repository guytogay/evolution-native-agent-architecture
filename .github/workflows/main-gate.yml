name: Main Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-v0310:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.3.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Patch one-shot census to all old Current labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/_tmp_prepare_v0310.py')
          s = p.read_text(encoding='utf-8')
          old_tail = "    'releases/current/language-projections/semantic-fixtures.v2.yaml',\n]"
          new_tail = "    'releases/current/language-projections/semantic-fixtures.v2.yaml',\n    'releases/current/templates/field-experience.v2.yaml',\n]"
          assert old_tail in s
          s = s.replace(old_tail, new_tail, 1)
          old_loop = "for rel in version_neutral_cold:\n    replace_exact(rel, 'v0.3.7 Current', 'Current')\n"
          new_loop = "for rel in version_neutral_cold:\n    p = Path(rel)\n    text = p.read_text(encoding='utf-8')\n    text, count = re.subn(r'v0\\.3\\.\\d+\\s+Current', 'Current', text, flags=re.I)\n    assert count >= 1, f'{rel}: expected at least one old active Current label'\n    p.write_text(text, encoding='utf-8')\n"
          assert old_loop in s
          s = s.replace(old_loop, new_loop, 1)
          p.write_text(s, encoding='utf-8')
          print('ONE_SHOT_CENSUS_PATCHED')
          PY
      - name: Build, read back, and push the atomic v0.3.10 release commit
        run: python research/_tmp_prepare_v0310.py

  main-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Verify live Current entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          required = ['README.md','NOW.md','LICENSE','releases/current/00-READ-ME-FIRST.md','releases/current/CURRENT-BASELINE.yaml']
          assert not [p for p in required if not Path(p).is_file()]
          root = Path('releases/current')
          doc = yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text())
          assert doc['current'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []): assert (root/rel).is_file(), rel
          print('main-current-pass', doc['ena_version'])
          PY
      - name: Run compact Current semantic selftest
        run: python releases/current/tools/validate_contracts.py selftest

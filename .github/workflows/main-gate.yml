name: Main Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Verify live Current entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          required = ['README.md','NOW.md','LICENSE','releases/current/00-READ-ME-FIRST.md','releases/current/CURRENT-BASELINE.yaml']
          assert not [p for p in required if not Path(p).is_file()]
          root = Path('releases/current')
          doc = yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text())
          assert doc['current'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []): assert (root/rel).is_file(), rel
          print('main-current-pass', doc['ena_version'])
          PY
      - name: Verify Current active operational/reference policy state
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('releases/current')
          ri = yaml.safe_load((root/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8'))
          com = ri['routes']['OA-COM-01']
          assert com['reference_state'] == 'NOT_BUNDLED_RESEARCH_PROTOTYPE'
          assert com['research_only_reference'] == 'commitment-settlement-recovered'
          assert 'deferred_reason' not in com
          assert 'CANDIDATE' not in str(com).upper()

          rm = yaml.safe_load((root/'references/REFERENCE-MANIFEST.yaml').read_text(encoding='utf-8'))
          assert 'release' not in rm
          assert rm['machine_evidence']['assembly_provenance_release'] == 'v0.3.7'
          assert 'Candidate Assembly Gate' in rm['machine_evidence']['workflow']
          deferred = {x['id']: x for x in rm['deferred_not_bundled']}
          d = deferred['commitment-settlement-recovered']
          assert d['disposition'] == 'RETAIN_IN_RESEARCH_UNTIL_CURRENT_ADOPTION_NEED_AND_EVIDENCE_JUSTIFY_BUNDLING'
          assert 'CANDIDATE' not in d['disposition']
          assert d['retired'] is False

          t2 = yaml.safe_load((root/'templates/field-experience.v2.yaml').read_text(encoding='utf-8'))
          assert t2['participant']['ena_semantic_identity'] == 'EXPLICITLY_STATE_ACTUAL_SEMANTIC_IDENTITY'

          print('main-active-policy-pass')
          PY
      - name: Run compact Current semantic selftest
        run: python releases/current/tools/validate_contracts.py selftest

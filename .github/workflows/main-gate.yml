name: Main Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, scratch/doubao-thread-reader]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    name: main-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Verify live entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'README.md',
              'NOW.md',
              'LICENSE',
              'CONTRIBUTING.md',
              'SECURITY.md',
              'releases/current/00-READ-ME-FIRST.md',
              'releases/current/CURRENT-BASELINE.yaml',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'missing required repository files: {missing}'
          print('live-entrypoints-pass')
          PY

      - name: Validate Current baseline pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root / 'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []):
              assert (root / rel).is_file(), f'missing core file: {rel}'
          lite = doc.get('lite_entrypoint')
          assert lite and (root / lite).is_file(), f'missing LITE entrypoint: {lite}'
          print('current-baseline-pointer-pass', doc.get('ena_version'), doc.get('adoption_status'))
          PY

      - name: Run compact Current semantic selftest
        run: python releases/current/tools/validate_contracts.py selftest

  scratch-doubao-fetch:
    if: github.ref == 'refs/heads/scratch/doubao-thread-reader'
    name: scratch-doubao-fetch
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Render public Doubao thread with hosted Chrome
        env:
          THREAD_URL: https://www.doubao.com/thread/xDQe8KM1QaLE7DMq2
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          "$CHROME_PATH" --version
          timeout 60s "$CHROME_PATH" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-blink-features=AutomationControlled \
            --user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            --virtual-time-budget=20000 \
            --dump-dom "$THREAD_URL" > doubao-dom.html
          wc -c doubao-dom.html

      - name: Extract visible-ish text from rendered DOM
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import html, re

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]
                  self.skip=0
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','svg','noscript'}:
                      self.skip += 1
                  if tag in {'p','div','section','article','li','h1','h2','h3','h4','br'} and not self.skip:
                      self.parts.append('\n')
              def handle_endtag(self, tag):
                  if tag in {'script','style','svg','noscript'} and self.skip:
                      self.skip -= 1
                  if tag in {'p','div','section','article','li','h1','h2','h3','h4'} and not self.skip:
                      self.parts.append('\n')
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          raw=Path('doubao-dom.html').read_text(encoding='utf-8', errors='replace')
          p=TextExtractor(); p.feed(raw)
          text=''.join(p.parts).replace('\u00a0',' ')
          lines=[]
          for line in text.splitlines():
              line=re.sub(r'\s+',' ',line).strip()
              if line and (not lines or line != lines[-1]):
                  lines.append(line)
          out='\n'.join(lines)
          Path('doubao-thread.txt').write_text(out, encoding='utf-8')
          print('TEXT_CHARS', len(out))
          print('---THREAD_BEGIN---')
          print(out)
          print('---THREAD_END---')
          PY

      - name: Upload rendered thread evidence
        uses: actions/upload-artifact@v4
        with:
          name: doubao-thread-xdqe8
          path: |
            doubao-thread.txt
            doubao-dom.html
          if-no-files-found: error

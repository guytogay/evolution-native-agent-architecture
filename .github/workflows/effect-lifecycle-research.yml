name: Effect Lifecycle Research

on:
  pull_request:
    paths:
      - 'research/prototypes/effect-lifecycle/**'
      - '.github/workflows/effect-lifecycle-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-lifecycle-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validator
        run: python -m py_compile research/prototypes/effect-lifecycle/tools/validate_effect_lifecycle.py

      - name: Run deterministic lifecycle fixtures
        run: python research/prototypes/effect-lifecycle/tools/validate_effect_lifecycle.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=REPRESENTED_LIFECYCLE_CONSISTENCY_AND_REFERENCE_NEXT_ACTION_ONLY'
          echo 'EXTERNAL_RECEIPT_AUTHENTICITY=UNPROVEN'
          echo 'EXACTLY_ONCE=NOT_CLAIMED'
          echo 'CURRENT_CHANGE=NO'

name: Independent V2.3 Frozen Validation

on:
  push:
    branches:
      - independent-validation/v23-gpt56sol-20260821
  pull_request:
  workflow_dispatch:

jobs:
  frozen-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact freeze record
        uses: actions/checkout@v4
        with:
          ref: 89d5f97c71a762ec8b06e3a43cb385c96d2ad926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify freeze-record identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "89d5f97c71a762ec8b06e3a43cb385c96d2ad926"
          git cat-file -e 8eb5a9afa4c560645b4c50dc24af7874ed54a4f2^{commit}

      - name: Verify frozen candidate SHA-256 manifest
        shell: bash
        run: |
          python research/prototypes/v2-machine-contract-hardening/v2.3/freeze_hashes.py 8eb5a9afa4c560645b4c50dc24af7874ed54a4f2 > frozen-hashes.txt
          cat frozen-hashes.txt
          python - <<'PY'
          from pathlib import Path
          expected = {
          'research/prototypes/v2-machine-contract-hardening/hardened_rules.py':'5de4e32a57c52e8c9fc427a03e1bdac23108270f2ff3858983c0de090a518788',
          'research/prototypes/v2-machine-contract-hardening/fixtures.py':'b71eb53f139d21e5a35a9b361598409e313d5dadf9cc47e74bff8425c6f5442f',
          'research/prototypes/v2-machine-contract-hardening/v2.1/fixtures_v21.py':'0ba4915ba68974efca1d0108dcf99d536665920db508dacababf945bc02707f9',
          'research/prototypes/v2-machine-contract-hardening/v2.2/cumulative_contract.py':'f2f1a49f8873967f27a161a5f4646e64b94cc71170daa06b7cea246ceb49bab9',
          'research/prototypes/v2-machine-contract-hardening/v2.2/fixtures_v22.py':'fbda0869dfd3dac34b97ecca9f265992896d1f1033f1be1ab0e346fae2d4787b',
          'research/prototypes/v2-machine-contract-hardening/v2.2/run_v22.py':'91dbdc5e50cd5148ac560edd52f6a8e6b3d4899fa5ca921427a05867aba303f7',
          'research/prototypes/v2-machine-contract-hardening/v2.3/acceptance_semantics.py':'c50c667353027fc4e402d258580e4ac03f1b2d0e4e317e320f5585394c050277',
          'research/prototypes/v2-machine-contract-hardening/v2.3/fixtures_migrated.py':'f9e819a405a2837164d1f2f9dce807e8d02a6df63354b2d309067e6dc0753962',
          'research/prototypes/v2-machine-contract-hardening/v2.3/run_v23.py':'ecceb3e193a439ac820bca3ce7101435dfeb29ade738a80b1cab19e2c10bed15',
          'research/prototypes/v2-machine-contract-hardening/v2.3/expected-verdict-manifest.json':'27f37659b18ed41771a71cfe9d5a3e1e41bbda9203f08bc2ecf878497eac901b',
          'research/prototypes/v2-machine-contract-hardening/v2.3/results-v23.json':'03acbee06c332ad5f8faddde2bf263815eed06c699ee1c020db07367b7710430',
          }
          actual={}
          for line in Path('frozen-hashes.txt').read_text().splitlines():
              h,p=line.split('  ',1); actual[p]=h
          assert set(actual) == set(expected), (set(actual)-set(expected), set(expected)-set(actual))
          for p,h in expected.items():
              assert actual[p]==h, (p, actual[p], h)
          print('all 11 freeze-manifest SHA-256 entries matched')
          PY

      - name: Frozen replay
        shell: bash
        run: |
          python research/prototypes/v2-machine-contract-hardening/v2.3/run_v23.py | tee replay.txt
          grep -q "UNEXPECTED_VERDICTS  : 0" replay.txt
          grep -q "TOTAL_FIXTURES       : 53" replay.txt

      - name: Confirm replay regenerated committed outputs without semantic diff
        shell: bash
        run: |
          git diff --exit-code -- research/prototypes/v2-machine-contract-hardening/v2.3/results-v23.json research/prototypes/v2-machine-contract-hardening/v2.3/expected-verdict-manifest.json

  independent-semantic-probes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent validator branch
        uses: actions/checkout@v4

      - name: Checkout exact frozen candidate separately
        uses: actions/checkout@v4
        with:
          ref: 89d5f97c71a762ec8b06e3a43cb385c96d2ad926
          path: frozen
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute independent probes against exact frozen implementation
        shell: bash
        run: |
          python research/independent-validation/v23_independent_probes.py frozen | tee independent-probes.json

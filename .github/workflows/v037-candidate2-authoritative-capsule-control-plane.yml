name: ENA v0.3.7 Candidate.2 Authoritative Capsule Control Plane

on:
  push:
    paths:
      - '.github/candidate2-authoritative-capsule-control-plane.trigger'
      - '.github/scripts/correct_v037_candidate2_authoritative_capsule_control_plane.py'
      - '.github/workflows/v037-candidate2-authoritative-capsule-control-plane.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Bind immutable candidate and authoritative carrier evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/v0.3.7-candidate)" = "d5fefc8c786d7e40b3e9a59211ee7045bccee5bf"
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/current)" = "7dcbb3934883ffa6cc5292a662588cafc1533cff"
          test -f research/methodology/PHYSICALLY-ISOLATED-INDEPENDENT-REVIEW-CARRIER.md
          test -f collaboration/reconciliation/2026-08-28-v037-candidate2-isolated-review-capsule-r3.md
          test -f research/handoffs/records/2026-08-28-v037-candidate2-isolated-as-ready/HANDOFF-MANIFEST.yaml

      - name: Correct canonical surfaces to authoritative carrier
        run: python3 .github/scripts/correct_v037_candidate2_authoritative_capsule_control_plane.py

      - name: Verify scope and authority
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            research/ACTIVE-RESEARCH.yaml
            research/RESEARCH-START-HERE.md
            research/handoffs/CURRENT-HANDOFF.yaml
            research/plans/PROGRESS.yaml
          )
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${expected[@]}" | sort >/tmp/expected
          printf '%s\n' "${changed[@]}" | sort >/tmp/observed
          diff -u /tmp/expected /tmp/observed
          test -z "$(git diff --name-only -- releases/current releases/v0.3.7-candidate)"
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          paths=[Path('research/ACTIVE-RESEARCH.yaml'),Path('research/plans/PROGRESS.yaml'),Path('research/handoffs/CURRENT-HANDOFF.yaml')]
          for p in paths: yaml.safe_load(p.read_text())
          text='\n'.join(p.read_text() for p in paths+[Path('research/RESEARCH-START-HERE.md')])
          for stale in ['ee80ac827dedff7a8de9d10f0a9cbcd70c66f3b7b885296f9e2335af6ec92131','b3e2222c591a2760b976e6791f18e2494c17063ddfe539291f1cd8799fd54bcd','33131665994','9670480727','INDEPENDENT-VALIDATION-CAPSULE-CARRIER.md','candidate2-isolated-as-capsule-ready']:
              assert stale not in text, stale
          for req in ['dfe15a686668440138bfd624453059d61a0b28625bb9a5e0c185b33eccf9c2da','427a1776aea199f5f27c4bea2827d3c827cf82fab2c8cd403da0e8cc1dd97649','33131773164','9670518379','9670518708','9670518979','PHYSICALLY-ISOLATED-INDEPENDENT-REVIEW-CARRIER.md','2026-08-28-v037-candidate2-isolated-as-ready']:
              assert req in text, req
          print('AUTHORITATIVE_CAPSULE_CONTROL_PLANE=PASS')
          PY

      - name: Commit authoritative correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE-RESEARCH.yaml research/RESEARCH-START-HERE.md research/handoffs/CURRENT-HANDOFF.yaml research/plans/PROGRESS.yaml
          git commit -m 'control-plane: align candidate.2 to authoritative isolated carrier'
          git push origin HEAD:research/ena-reconstruction

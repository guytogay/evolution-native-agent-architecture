name: ENA v0.3.7 Candidate.3 Legacy Relocation Observation

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - '.github/workflows/v037-candidate3-legacy-relocation-observation.yml'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7e88d7adb70396bd671ca97066daf2c120e0adc
          fetch-depth: 0
      - name: Show exact relocation diffs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== candidate1 adversarial relocation diff ==='
          diff -u releases/current/tools/candidate1_adversarial.py releases/v0.3.7-candidate/tools/legacy/candidate1_adversarial_v1_2.py || true
          echo '=== candidate2 adversarial relocation diff ==='
          diff -u releases/current/tools/candidate2_adversarial.py releases/v0.3.7-candidate/tools/legacy/candidate2_adversarial_v1_2.py || true
          echo '=== legacy probe execution ==='
          python releases/v0.3.7-candidate/tools/legacy/candidate1_adversarial_v1_2.py
          python releases/v0.3.7-candidate/tools/legacy/candidate2_adversarial_v1_2.py
          echo LEGACY_RELOCATION_OBSERVATION=COMPLETE

name: Current Immutability Guard

on:
  push:
    branches: [main]
    paths:
      - 'releases/current/**'
      - '.github/workflows/current-immutability.yml'
  pull_request:
    paths:
      - 'releases/current/**'
      - '.github/workflows/current-immutability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-same-version-bytes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject same-version Current byte mutation
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            local text key_count canonical_count line
            text="$(cat)"
            key_count="$(printf '%s\n' "$text" | grep -Ec '^[[:space:]]*ena_version[[:space:]]*:' || true)"
            canonical_count="$(printf '%s\n' "$text" | grep -Ec '^ena_version: v[0-9]+\.[0-9]+\.[0-9]+$' || true)"

            if [[ "$key_count" -ne 1 || "$canonical_count" -ne 1 ]]; then
              echo "::error::CURRENT-BASELINE.yaml must contain exactly one canonical top-level identity line: ena_version: vN.N.N" >&2
              return 2
            fi

            line="$(printf '%s\n' "$text" | grep -E '^ena_version: v[0-9]+\.[0-9]+\.[0-9]+$')"
            printf '%s\n' "${line#ena_version: }"
          }

          assert_version_pass() {
            local expected="$1" input="$2" actual
            actual="$(printf '%s' "$input" | read_version)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Version parser self-test expected $expected, got $actual"
              exit 1
            fi
          }

          assert_version_reject() {
            local input="$1"
            if printf '%s' "$input" | read_version >/dev/null 2>&1; then
              echo "::error::Version parser self-test accepted a non-canonical or ambiguous ena_version representation."
              exit 1
            fi
          }

          # F-208-11 regression coverage: semantic no-op serialization or duplicate
          # keys must not masquerade as a successor identity.
          assert_version_pass 'v0.3.14' $'ena_version: v0.3.14\n'
          assert_version_reject $"ena_version: 'v0.3.14'\n"
          assert_version_reject $'ena_version: v0.3.14 # same semantic value\n'
          assert_version_reject $'ena_version: v0.3.15\nena_version: v0.3.14\n'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            echo "workflow_dispatch: parser self-test passed; no predecessor comparison required"
            exit 0
          fi

          HEAD_SHA="${{ github.sha }}"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparable predecessor SHA; skipping immutability comparison."
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- releases/current/; then
            echo "No releases/current byte changes."
            exit 0
          fi

          BASE_VERSION="$(git show "$BASE_SHA:releases/current/CURRENT-BASELINE.yaml" | read_version)"
          HEAD_VERSION="$(read_version < releases/current/CURRENT-BASELINE.yaml)"

          echo "Current predecessor version: $BASE_VERSION"
          echo "Current proposed version:    $HEAD_VERSION"

          if [[ "$BASE_VERSION" == "$HEAD_VERSION" ]]; then
            echo "::error::releases/current bytes changed while ena_version remained $HEAD_VERSION. SAME_VERSION => SAME_EFFECTIVE_CONTENT; publish a successor version instead of mutating released Current in place."
            exit 1
          fi

          echo "CURRENT_SUCCESSOR_IDENTITY_CHANGED_PASS: $BASE_VERSION -> $HEAD_VERSION"

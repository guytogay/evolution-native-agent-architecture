name: Lineage Compaction Research

on:
  pull_request:
    paths:
      - 'research/prototypes/lineage-compaction-contract/**'
      - '.github/workflows/lineage-compaction-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-compaction-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/lineage-compaction-contract/validate_lineage_compaction.py \
            research/prototypes/lineage-compaction-contract/selftest_lineage_compaction.py

      - name: Run deterministic compaction corpus
        run: python research/prototypes/lineage-compaction-contract/selftest_lineage_compaction.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=REPRESENTED_DECISION_MATERIAL_LINEAGE_COMPACTION_ONLY'
          echo 'SOURCE_COMPLETENESS=UNPROVEN'
          echo 'COLD_REF_RETRIEVABILITY=UNPROVEN'
          echo 'EXTERNAL_SETTLEMENT_AUTHENTICITY=UNPROVEN'
          echo 'SOURCE_AUTHORITY_NE_RECEIVER_AUTHORITY=YES'
          echo 'SUMMARY_VALID_NE_MATERIAL_USE_READY=YES'
          echo 'CURRENT_CHANGE=NO'

name: Finite Context Adoption Research

on:
  pull_request:
    paths:
      - 'research/prototypes/finite-context-adoption/**'
      - 'research/reconstruction/CARDINALITY-DISCOVERY-GUARD.md'
      - '.github/workflows/finite-context-adoption-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-context-adoption-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile currently implemented plural adoption HOW tools
        run: |
          python -m py_compile \
            research/prototypes/finite-context-adoption/tools/file_git_adoption.py \
            research/prototypes/finite-context-adoption/tools/tool_native_adoption.py \
            research/prototypes/finite-context-adoption/tools/monolithic_hot_adoption.py \
            research/prototypes/finite-context-adoption/tools/compiled_projection_adoption.py \
            research/prototypes/finite-context-adoption/tools/native_host_rebind.py \
            research/prototypes/finite-context-adoption/tools/selftest_finite_context_adoption.py \
            research/prototypes/finite-context-adoption/deployment/install_file_git_adoption.py \
            research/prototypes/finite-context-adoption/deployment/gate_native_retrieval_result.py \
            research/prototypes/finite-context-adoption/deployment/inspect_monolithic_hot_projection.py \
            research/prototypes/finite-context-adoption/deployment/compile_local_projection.py \
            research/prototypes/finite-context-adoption/deployment/validate_native_host_rebind.py \
            research/prototypes/finite-context-adoption/deployment/selftest_deployment_recipes.py

      - name: Run plural adoption HOW selftest
        run: python research/prototypes/finite-context-adoption/tools/selftest_finite_context_adoption.py

      - name: Run deployment recipe selftest
        run: python research/prototypes/finite-context-adoption/deployment/selftest_deployment_recipes.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'CURRENTLY_IMPLEMENTED_HOWS=FILE_GIT_TINY_COLD,TOOL_NATIVE_RETRIEVAL,MONOLITHIC_HOT,HYBRID_COMPILED_PROJECTION,NATIVE_HOST_REBIND'
          echo 'HOW_CARDINALITY=OPEN'
          echo 'CURRENT_IMPLEMENTED_COUNT_IS_NOT_ONTOLOGY=TRUE'
          echo 'DEPLOYMENT_RECIPES=SEPARATE_NOT_ONE_ADAPTER_FRAMEWORK'
          echo 'UNIVERSAL_WINNER=NOT_SELECTED'
          echo 'MONOLITHIC_HOT=VALID_LOCAL_PHENOTYPE'
          echo 'NATIVE_REBIND=VALID_MATURE_HOST_PHENOTYPE_CANDIDATE'
          echo 'NATURALISTIC_APPLICATION=UNPROVEN'
          echo 'CURRENT_CHANGE=NO'

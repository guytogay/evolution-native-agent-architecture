name: ENA v0.3.7 Candidate.2 Fresh Intake Handoff Pointer

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-fresh-intake-handoff-pointer.trigger

permissions:
  contents: write

jobs:
  update-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Apply exact handoff pointer transform
        run: python .github/scripts/apply_v037_candidate2_fresh_intake_handoff_pointer.py

      - name: Enforce pointer-only scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "research/handoffs/CURRENT-HANDOFF.yaml"
          test -z "$(git diff --name-only -- releases/current releases/v0.3.7-candidate)"

      - name: Assert new handoff record exists
        run: |
          set -euo pipefail
          R='research/handoffs/records/2026-08-28-v037-candidate2-fresh-as-intake-ready'
          for f in HANDOFF-START-HERE.md HANDOFF-MANIFEST.yaml PROJECT-STATE.md RECENT-THREE-ROUNDS.md FILE-CATALOG.md HANDOFF-READBACK.md; do test -f "$R/$f"; done
          grep -q 'id: "2026-08-28-v037-candidate2-fresh-as-intake-ready"' research/handoffs/CURRENT-HANDOFF.yaml
          grep -q 'immediate_next_action: GET_GENUINELY_FRESH_REVIEWER_TO_RUN_CANDIDATE2_A_S' research/handoffs/CURRENT-HANDOFF.yaml

      - name: Commit pointer update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handoffs/CURRENT-HANDOFF.yaml
          git commit -m 'handoff: point to candidate.2 fresh A-S intake record'
          git push origin HEAD:research/ena-reconstruction

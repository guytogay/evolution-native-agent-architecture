name: Evidence Dependency Map Research

on:
  pull_request:
    paths:
      - 'research/prototypes/evidence-dependency-map/**'
      - '.github/workflows/evidence-dependency-map-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-map-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/evidence-dependency-map/tools/validate_evidence_dependency_map.py \
            research/prototypes/evidence-dependency-map/tools/selftest_evidence_dependency_map.py

      - name: Run portable adversarial selftest
        run: python research/prototypes/evidence-dependency-map/tools/selftest_evidence_dependency_map.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=KNOWN_DEPENDENCY_VISIBILITY_AND_MUTATION_TESTS_ONLY'
          echo 'INDEPENDENCE_SCORE=NOT_COMPUTED'
          echo 'FALSE_BLOCK_CONTROLS=SAME_MODEL_DISTINCT_WORLD,RECURRENCE_ONLY'
          echo 'CURRENT_CHANGE=NO'

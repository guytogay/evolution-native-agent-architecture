name: ENA v0.3.7 Candidate.2 A-S Sealed Control Plane

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - '.github/scripts/apply_v037_candidate2_as_sealed_control_plane.py'
      - '.github/workflows/v037-candidate2-as-sealed-control-plane.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Bind frozen candidate, Current, and A-S evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/v0.3.7-candidate)" = "d5fefc8c786d7e40b3e9a59211ee7045bccee5bf"
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/current)" = "7dcbb3934883ffa6cc5292a662588cafc1533cff"
          test -f collaboration/reconciliation/2026-08-28-v037-candidate2-independent-a-s-primary-r3.md
          test -f collaboration/reconciliation/2026-08-28-v037-candidate2-independent-a-s-primary-r3-seal.yaml
          test "$(wc -c < collaboration/reconciliation/2026-08-28-v037-candidate2-independent-a-s-primary-r3.md)" = "14839"
          test "$(sha256sum collaboration/reconciliation/2026-08-28-v037-candidate2-independent-a-s-primary-r3.md | awk '{print $1}')" = "0e6bb214cc3398b34c13fc6a3bebd1f548ae00ea067b4c338e8ce88f42ad955f"
          echo 'A_S_EXACT_CONTENT_BINDING=PASS'

      - name: Apply A-S sealed transition
        run: python3 .github/scripts/apply_v037_candidate2_as_sealed_control_plane.py

      - name: Verify exact scope and YAML
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            research/ACTIVE-RESEARCH.yaml
            research/RESEARCH-START-HERE.md
            research/handoffs/CURRENT-HANDOFF.yaml
            research/plans/PROGRESS.yaml
          )
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${expected[@]}" | sort >/tmp/expected
          printf '%s\n' "${changed[@]}" | sort >/tmp/observed
          diff -u /tmp/expected /tmp/observed
          test -z "$(git diff --name-only -- releases/current releases/v0.3.7-candidate)"
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in ['research/ACTIVE-RESEARCH.yaml','research/plans/PROGRESS.yaml','research/handoffs/CURRENT-HANDOFF.yaml']:
              yaml.safe_load(Path(p).read_text())
          print('A_S_SEALED_CONTROL_PLANE_SCOPE_AND_YAML=PASS')
          PY

      - name: Commit aligned control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE-RESEARCH.yaml research/RESEARCH-START-HERE.md research/handoffs/CURRENT-HANDOFF.yaml research/plans/PROGRESS.yaml
          git commit -m 'control-plane: seal candidate.2 A-S and route A-P next'
          git push origin HEAD:research/ena-reconstruction

name: Distributed History Merge Research

on:
  pull_request:
    paths:
      - 'research/prototypes/distributed-history-merge/**'
      - 'research/reconstruction/CARDINALITY-DISCOVERY-GUARD.md'
      - '.github/workflows/distributed-history-merge-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-history-merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile currently implemented plural HOW and cross-HOW tools
        run: |
          python -m py_compile \
            research/prototypes/distributed-history-merge/tools/git_dag_reference.py \
            research/prototypes/distributed-history-merge/tools/causal_sibling_reference.py \
            research/prototypes/distributed-history-merge/tools/event_stream_reference.py \
            research/prototypes/distributed-history-merge/tools/crdt_reference.py \
            research/prototypes/distributed-history-merge/tools/selftest_distributed_history_merge.py \
            research/prototypes/distributed-history-merge/tools/validate_distributed_history_merge.py \
            research/prototypes/distributed-history-merge/tools/selftest_cross_how_history.py

      - name: Run plural HOW and Host-fit selftest
        run: python research/prototypes/distributed-history-merge/tools/selftest_distributed_history_merge.py

      - name: Run cross-HOW causal/reconciliation adversarial selftest
        run: python research/prototypes/distributed-history-merge/tools/selftest_cross_how_history.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'CURRENTLY_IMPLEMENTED_HOWS=GIT_DAG,CAUSAL_SIBLINGS,EVENT_SOURCING,CRDT_DECLARED_COMMUTATIVE'
          echo 'HOW_CARDINALITY=OPEN'
          echo 'CURRENT_IMPLEMENTED_COUNT_IS_NOT_ONTOLOGY=TRUE'
          echo 'FIXTURE_CARDINALITY=OPEN_WITH_TARGETED_REGRESSION_DEPENDENCIES'
          echo 'UNIVERSAL_WINNER=NOT_SELECTED'
          echo 'FUNCTION_PARITY_BETWEEN_HOWS=NOT_CLAIMED'
          echo 'HOST_FIT_SELECTION=MULTIPLE_ACCEPTABLE_HOWS_ALLOWED'
          echo 'CROSS_HOW_SCOPE=REPRESENTED_HEADS_STALE_CONFLICT_AND_CAUSAL_RECONCILIATION_ONLY'
          echo 'FALSE_BLOCK_CONTROLS=CRDT_AUTO_NONMATERIAL,SINGLE_WRITER_LINEAR'
          echo 'SEMANTIC_TRUTH=UNPROVEN'
          echo 'AUTHORITY=OUT_OF_SCOPE'
          echo 'EXTERNAL_EFFECT_SETTLEMENT=OUT_OF_SCOPE'
          echo 'CURRENT_CHANGE=NO'

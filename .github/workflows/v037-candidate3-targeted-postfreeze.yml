name: ENA v0.3.7 Candidate.3 Targeted Post-Freeze Revalidation

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - '.github/scripts/v037_candidate3_targeted_postfreeze.py'
      - '.github/workflows/v037-candidate3-targeted-postfreeze.yml'

permissions:
  contents: read

jobs:
  targeted-postfreeze:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FROZEN_SOURCE: 'b7e88d7adb70396bd671ca97066daf2c120e0adc'
      FROZEN_TREE: 'e3a9a20d16cecd78df7f32f19fca56e21159e810'
      CURRENT_TREE: '7dcbb3934883ffa6cc5292a662588cafc1533cff'
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0
          path: control

      - name: Checkout exact frozen candidate3
        uses: actions/checkout@v4
        with:
          ref: b7e88d7adb70396bd671ca97066daf2c120e0adc
          fetch-depth: 0
          path: target

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Bind frozen occurrence identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git -C target rev-parse HEAD:releases/v0.3.7-candidate)" = "$FROZEN_TREE"
          test "$(git -C target rev-parse HEAD:releases/current)" = "$CURRENT_TREE"
          test -f control/collaboration/reconciliation/2026-08-28-v037-candidate3-freeze.md
          grep -q "$FROZEN_SOURCE" control/collaboration/reconciliation/2026-08-28-v037-candidate3-freeze.md
          grep -q "$FROZEN_TREE" control/collaboration/reconciliation/2026-08-28-v037-candidate3-freeze.md
          echo CANDIDATE3_POSTFREEZE_BINDING=PASS

      - name: Replay six candidate2 Phase-B repair classes
        run: python control/.github/scripts/v037_candidate3_targeted_postfreeze.py --repo target

      - name: Reconfirm inherited valid behavior and package integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='target/releases/v0.3.7-candidate'
          python "$ROOT/tools/regression_suite.py" | tee /tmp/reg.log
          grep -q 'inherited 164-case corpus : 164/164 passed (ZERO flips required)' /tmp/reg.log
          grep -q 'successor closure corpus  : 61/61 passed' /tmp/reg.log
          git -C target diff --exit-code -- releases/v0.3.7-candidate/tools/regression-results-v033.json
          python "$ROOT/tools/validate_evolution_record_v2.py" --selftest | grep 'EVOLUTION_RECORD_V2_SELFTEST_PASS 35'
          python "$ROOT/references/general/effect-lifecycle/tools/validate_effect_lifecycle.py"
          test -z "$(git -C target status --porcelain)"
          test "$(git -C target rev-parse HEAD:releases/v0.3.7-candidate)" = "$FROZEN_TREE"
          echo CANDIDATE3_POSTFREEZE_VALID_COMPATIBILITY=PASS

      - name: Emit bounded disposition
        run: |
          echo 'CANDIDATE3_TARGETED_POSTFREEZE_VERDICT=PASS'
          echo 'sealed_candidate2_material_repair_classes=CLOSED_BY_TARGETED_REPLAY'
          echo 'fresh_search_space_independence=NOT_CLAIMED'
          echo 'attack_cardinality=OPEN'
          echo 'external_truth=NOT_ESTABLISHED'
          echo 'release_reconciliation=PERMITTED_NOT_AUTOMATICALLY_DECIDED'

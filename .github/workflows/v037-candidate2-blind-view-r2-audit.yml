name: ENA v0.3.7 Candidate.2 Blind View r2 Audit

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-blind-view-r2-audit.trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Fetch exact r2 validation view
        run: |
          set -euo pipefail
          git fetch origin validation/v037-c2-blind-semantic-primary-r2
          test "$(git rev-parse origin/validation/v037-c2-blind-semantic-primary-r2)" = "cdcd8f0dd450ebff12b600078c22fce31bf6cb2a"

      - name: Verify blind-view r2 exact bytes and exclusion shape
        run: python .github/scripts/verify_v037_candidate2_blind_view_r2.py

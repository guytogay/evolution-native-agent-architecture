name: Contested Authorship Research

on:
  pull_request:
    paths:
      - 'research/prototypes/contested-authorship/**'
      - '.github/workflows/contested-authorship-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contested-authorship-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/contested-authorship/tools/validate_contested_authorship.py \
            research/prototypes/contested-authorship/tools/selftest_contested_authorship.py

      - name: Run portable adversarial selftest
        run: python research/prototypes/contested-authorship/tools/selftest_contested_authorship.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=DURABLE_SELF_CHANGE_PROVENANCE_READBACK_CONFLICT_AUTHORITY_MUTATION_TESTS_ONLY'
          echo 'FALSE_BLOCK_CONTROLS=LOW_HEURISTIC,CACHE_OUT_OF_SCOPE'
          echo 'SINCERE_AUTHORSHIP=UNPROVEN'
          echo 'EXTERNAL_AUTHORITY=NOT_MINTED'
          echo 'CURRENT_CHANGE=NO'

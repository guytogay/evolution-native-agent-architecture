name: ENA v0.3.7 Candidate.2 Cleanroom Control Plane

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - '.github/scripts/apply_v037_candidate2_cleanroom_control_plane.py'
      - '.github/workflows/v037-candidate2-cleanroom-control-plane.yml'
      - '.github/candidate2-cleanroom-control-plane.trigger'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Bind immutable candidate and clean-room state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/v0.3.7-candidate)" = "d5fefc8c786d7e40b3e9a59211ee7045bccee5bf"
          test "$(git rev-parse bda470e0a6b170cec61225a905957a501454a2fe:releases/current)" = "7dcbb3934883ffa6cc5292a662588cafc1533cff"
          test -f collaboration/reconciliation/2026-08-28-v037-candidate2-cleanroom-carrier-transition.md
          test -f research/handoffs/records/2026-08-28-v037-candidate2-cleanroom-as-ready/HANDOFF-MANIFEST.yaml

          git clone --quiet --no-checkout https://github.com/guytogay/independent-validation-cleanroom.git /tmp/cleanroom
          test "$(git -C /tmp/cleanroom rev-parse origin/main)" = "28dde50c9caaeee3b5cfabf51410083dbbb05a93"
          test "$(git -C /tmp/cleanroom show -s --format=%T 28dde50c9caaeee3b5cfabf51410083dbbb05a93)" = "42debebed620bd05e6e2635409057f20b57bfa9e"
          test "$(git -C /tmp/cleanroom show -s --format=%P 28dde50c9caaeee3b5cfabf51410083dbbb05a93)" = ""
          echo 'CLEANROOM_IDENTITY_BINDING=PASS'

      - name: Apply clean-room control-plane transition
        run: python3 .github/scripts/apply_v037_candidate2_cleanroom_control_plane.py

      - name: Verify exact mutation scope and parse YAML
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            research/ACTIVE-RESEARCH.yaml
            research/RESEARCH-START-HERE.md
            research/handoffs/CURRENT-HANDOFF.yaml
            research/plans/PROGRESS.yaml
          )
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${expected[@]}" | sort >/tmp/expected
          printf '%s\n' "${changed[@]}" | sort >/tmp/observed
          diff -u /tmp/expected /tmp/observed
          test -z "$(git diff --name-only -- releases/current releases/v0.3.7-candidate)"
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in ['research/ACTIVE-RESEARCH.yaml','research/plans/PROGRESS.yaml','research/handoffs/CURRENT-HANDOFF.yaml']:
              yaml.safe_load(Path(p).read_text())
          print('CLEANROOM_CONTROL_PLANE_SCOPE_AND_YAML=PASS')
          PY

      - name: Commit aligned control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE-RESEARCH.yaml research/RESEARCH-START-HERE.md research/handoffs/CURRENT-HANDOFF.yaml research/plans/PROGRESS.yaml
          git commit -m 'control-plane: route candidate.2 fresh A-S through dedicated clean room'
          git push origin HEAD:research/ena-reconstruction

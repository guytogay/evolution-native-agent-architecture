name: Validate ENA v0.3.5 release

on:
  push:
    branches: ['release/v0.3.5', 'main']
    paths:
      - 'releases/current/**'
      - 'releases/v0.3.5-candidate/**'
      - 'README.md'
      - 'PROJECT-HUB.md'
      - '.github/workflows/v035-release-validate.yml'
  pull_request:
    paths:
      - 'releases/current/**'
      - 'releases/v0.3.5-candidate/**'
      - 'README.md'
      - 'PROJECT-HUB.md'
      - '.github/workflows/v035-release-validate.yml'
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Parse Current YAML and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          for p in sorted(root.rglob('*.json')):
              json.loads(p.read_text(encoding='utf-8'))
              print('json-parse-pass', p)
          for p in sorted(root.rglob('*.yaml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print('yaml-parse-pass', p)
          PY

      - name: Validate Current baseline identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['schema_version'] == '2.0'
          assert doc['ena_version'] == 'v0.3.5'
          assert doc['adoption_status'] == 'CURRENT'
          assert doc['maturity'] == 'FIELD_VALIDATION'
          assert doc['current'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          assert doc['active_mainline_axis'] is False
          lin = doc['lineage']
          assert lin['frozen_candidate2_source_commit'] == '8393b8b05d34797965c612e8b9ca938d306f6322'
          assert lin['frozen_candidate2_tree'] == 'b10854f191d9641138e2f44278f043f124a2e120'
          assert lin['candidate2_narrow_verdict'] == 'NARROW_REVALIDATION_SUPPORTED'
          assert doc['evolution']['migration_packet_cli_validates_lifecycle_enum'] is True
          assert doc['evolution']['migration_packet_cli_rejects_forged_authentication_claim'] is True
          assert doc['evolution']['migration_packet_cli_validates_transfer_status'] is True
          assert not (root/'CANDIDATE-BASELINE.yaml').exists()
          print('current-baseline-pass')
          PY

      - name: Ensure one adoption surface
        run: |
          test ! -d releases/v0.3.5-candidate
          test -f releases/current/CURRENT-BASELINE.yaml
          echo 'single-current-surface-pass'

      - name: Validate evolution-record template against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          root = Path('releases/current')
          schema = json.loads((root/'schemas/evolution-record.v1.schema.json').read_text(encoding='utf-8'))
          doc = json.loads((root/'templates/evolution-record.v1.json').read_text(encoding='utf-8'))
          jsonschema.validate(doc, schema)
          assert doc['environment']['ena_identity'] == 'v0.3.5'
          print('evolution-record-template-schema-pass')
          PY

      - name: Run inherited composed-validator regression suite
        run: python releases/current/tools/regression_suite.py

      - name: Check committed inherited regression result matches generated output
        run: git diff --exit-code -- releases/current/tools/regression-results-v033.json

      - name: Run evolution metabolism selftest
        run: python releases/current/tools/ena_evolve.py selftest

      - name: Run candidate.1 historical adversarial regressions
        run: python releases/current/tools/candidate1_adversarial.py

      - name: Run candidate.2 historical residual-closure regressions
        run: python releases/current/tools/candidate2_adversarial.py

      - name: Validate actual evolution tool state and packet against schemas
        shell: bash
        run: |
          set -euo pipefail
          ROOT='releases/current'
          TOOL="$ROOT/tools/ena_evolve.py"
          TMP="$(mktemp -d)"
          STATE="$TMP/state.json"
          PACKET="$TMP/packet.json"
          python "$TOOL" --state "$STATE" init >/dev/null
          CID="$(python "$TOOL" --state "$STATE" propose --hypothesis 'release schema wiring' --change 'test change' --variation-space 'ci-sandbox' --expected quality | python -c 'import json,sys; print(json.load(sys.stdin)["candidate_id"])')"
          python "$TOOL" --state "$STATE" experiment "$CID" --actual-change 'test change' >/dev/null
          python "$TOOL" --state "$STATE" evaluate "$CID" --selection SUPPORTED --outcome quality=IMPROVED --evidence ci-observation >/dev/null
          python "$TOOL" --state "$STATE" export "$CID" --output "$PACKET" >/dev/null
          STATE="$STATE" PACKET="$PACKET" ROOT="$ROOT" python - <<'PY'
          import json, os
          from pathlib import Path
          import jsonschema
          root = Path(os.environ['ROOT'])
          state = json.loads(Path(os.environ['STATE']).read_text(encoding='utf-8'))
          candidate = state['candidates'][0]
          packet = json.loads(Path(os.environ['PACKET']).read_text(encoding='utf-8'))
          evo_schema = json.loads((root/'schemas/evolution-record.v1.schema.json').read_text(encoding='utf-8'))
          packet_schema = json.loads((root/'schemas/adaptation-packet.v1.schema.json').read_text(encoding='utf-8'))
          jsonschema.validate(candidate, evo_schema)
          jsonschema.validate(packet, packet_schema)
          assert candidate['selection_state'] == 'SUPPORTED'
          assert packet['source_selection_state'] == 'SUPPORTED'
          assert packet['packet_purpose'] == 'ADAPTATION_CANDIDATE'
          assert packet['source_authentication'] == 'NOT_AUTHENTICATED_BY_THIS_PACKET'
          assert packet['transfer_status'] == 'TRANSFERRED_SOURCE_EVIDENCE_NOT_LOCAL_PROOF'
          print('actual-tool-schema-wiring-pass')
          PY

      - name: Compile Current Python tools
        run: python -m py_compile releases/current/tools/*.py

      - name: Check Constitution identity parity across English and Chinese
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('releases/current')
          def ids(path):
              return re.findall(r'ENA-CON-\d{3}', path.read_text(encoding='utf-8'))
          en = ids(root/'01-CONSTITUTION.md')
          zh = ids(root/'language-projections/zh-CN/01-CONSTITUTION.md')
          expected = [f'ENA-CON-{i:03d}' for i in range(1,39)]
          assert en == expected, ('English Constitution IDs differ', en)
          assert zh == expected, ('Chinese Constitution IDs differ', zh)
          print('constitution-id-parity-pass', len(en))
          PY

      - name: Check bilingual semantic-fixture structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root/'language-projections/semantic-fixtures.v1.yaml').read_text(encoding='utf-8'))
          cases = doc.get('cases') or []
          assert cases, 'no semantic fixtures'
          ids = set()
          for case in cases:
              cid = case['id']
              assert cid not in ids, f'duplicate fixture id: {cid}'
              ids.add(cid)
              assert case.get('en', '').strip(), f'missing English scenario: {cid}'
              assert case.get('zh-CN', '').strip(), f'missing Chinese scenario: {cid}'
              assert case.get('semantic_ids'), f'missing semantic IDs: {cid}'
              assert case.get('expected_properties'), f'missing expected properties: {cid}'
          print('language-fixture-structure-pass', len(cases))
          PY

      - name: Check zh-CN Current projection manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          manifest = yaml.safe_load((root/'language-projections/zh-CN/projection-manifest.yaml').read_text(encoding='utf-8'))
          assert manifest['language'] == 'zh-CN'
          assert manifest['projection_version'] == 'v0.3.5.zh-CN.1'
          assert manifest['source_semantic_version'] == 'v0.3.5'
          assert manifest['status'] == 'CURRENT_SEMANTIC_PROJECTION'
          assert manifest['validation']['behavioral_semantic_conformance'] == 'UNPROVEN_UNIVERSALLY_FIELD_EVIDENCE_REQUIRED'
          for rel in manifest['coverage']:
              assert (root/'language-projections/zh-CN'/rel).is_file(), f'missing zh-CN file: {rel}'
          print('zh-cn-current-projection-pass')
          PY

      - name: Check Current hot-path identity and status text
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('releases/current')
          active = [
              root/'README.md',
              root/'00-READ-ME-FIRST.md',
              root/'07-ADOPTION-AND-FIELD-VALIDATION.md',
              root/'08-RELEASE-DISCIPLINE.md',
              root/'09-EVOLUTION-METABOLISM.md',
              root/'10-LANGUAGE-PORTABILITY.md',
              root/'AGENT-ADOPTION-INSTRUCTION.md',
              root/'LITE-ADOPTION-INSTRUCTION.md',
              root/'RUNTIME-ADOPTION-KERNEL.md',
              root/'language-projections/zh-CN/00-READ-ME-FIRST.md',
              root/'language-projections/zh-CN/09-EVOLUTION-METABOLISM.md',
              root/'language-projections/zh-CN/RUNTIME-ADOPTION-KERNEL.md',
          ]
          for p in active:
              text = p.read_text(encoding='utf-8')
              first = text.splitlines()[0]
              assert 'candidate.2' not in first.lower(), (p, first)
          assert 'CURRENT / FIELD_VALIDATION / COMPLETE_ADOPTION_BASELINE' in (root/'README.md').read_text(encoding='utf-8')
          assert 'ENA exists to make sustained self-evolution viable.' in (root/'README.md').read_text(encoding='utf-8')
          print('current-hot-path-identity-pass')
          PY

      - name: Check root status model
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          hub = Path('PROJECT-HUB.md').read_text(encoding='utf-8')
          assert 'Git main != ENA Current' in readme
          assert 'Git main != ENA Current != ENA Mainline' not in readme
          assert 'historical `MAINLINE / NOT_MAINLINE` labels are no longer an active adopter-facing maturity axis' in readme
          assert 'active adopter-facing model is **Current + declared maturity/status**' in hub
          print('root-status-model-pass')
          PY

      - name: Build deterministic Current package
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import zipfile
          root = Path('releases/current')
          out = Path('ena-v0.3.5-current.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel = p.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(rel, (1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o644 & 0xFFFF) << 16
                  z.writestr(info, p.read_bytes())
          digest = sha256(out.read_bytes()).hexdigest()
          Path('ena-v0.3.5-current.zip.sha256').write_text(
              f'{digest}  {out.name}\n', encoding='utf-8')
          print(f'PACKAGE_SHA256={digest}')
          print(f'PACKAGE_FILES={sum(1 for p in root.rglob("*") if p.is_file())}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ena-v0.3.5-current
          path: |
            ena-v0.3.5-current.zip
            ena-v0.3.5-current.zip.sha256
          if-no-files-found: error

name: Tiny Hot Kernel Research

on:
  pull_request:
    paths:
      - 'research/prototypes/tiny-hot-kernel/**'
      - '.github/workflows/tiny-hot-kernel-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/tiny-hot-kernel/tools/validate_semantic_router.py \
            research/prototypes/tiny-hot-kernel/tools/score_tiny_kernel_results.py \
            research/prototypes/tiny-hot-kernel/tools/selftest_tiny_hot_kernel.py

      - name: Run portable deterministic selftest
        run: python research/prototypes/tiny-hot-kernel/tools/selftest_tiny_hot_kernel.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=REPRESENTED_STRUCTURE_FIXTURES_AND_SCORER_BEHAVIOR_ONLY'
          echo 'NATURALISTIC_SALIENCE=UNPROVEN'
          echo 'CURRENT_CHANGE=NO'

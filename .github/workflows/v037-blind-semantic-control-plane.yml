name: ENA v0.3.7 Blind Semantic Control Plane

on:
  push:
    branches: [research/ena-reconstruction]
    paths:
      - '.github/blind-semantic-control-plane.trigger'

permissions:
  contents: write

jobs:
  update-control-plane:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-anchor transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_v037_blind_semantic_control_plane.py').resolve()
          src = p.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    if count != 1 and not (label == "latest intake" and count == 2):\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n    return text.replace(old, new, 1)\n'''
          assert src.count(old) == 1, 'replace_once helper anchor drifted'
          src = src.replace(old, new, 1)
          scope = {'__name__': '__main__', '__file__': str(p)}
          exec(compile(src, str(p), 'exec'), scope)
          PY
      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- releases/current releases/v0.3.7-candidate)" || {
            echo 'blind-semantic control-plane update must not touch Current or candidate cargo'
            git diff --name-only -- releases/current releases/v0.3.7-candidate
            exit 1
          }
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            research/ACTIVE-RESEARCH.yaml \
            research/handoffs/CURRENT-HANDOFF.yaml \
            research/plans/PROGRESS.yaml | sort)
          actual=$(printf '%s\n' "$changed" | sort)
          test "$actual" = "$expected" || {
            echo 'unexpected control-plane mutation scope'
            exit 1
          }
          echo 'BLIND_SEMANTIC_CONTROL_PLANE_SCOPE_PASS'
      - name: Commit transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE-RESEARCH.yaml research/plans/PROGRESS.yaml research/handoffs/CURRENT-HANDOFF.yaml
          git commit -m 'control-plane: candidate.1 blind semantic A-S A-P next'
          git push origin HEAD:research/ena-reconstruction

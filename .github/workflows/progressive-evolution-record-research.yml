name: Progressive Evolution Record Research

on:
  pull_request:
    paths:
      - 'research/prototypes/evolution-record-progressive-envelope/**'
      - 'research/reconstruction/EVOLUTION-RECORD-PROGRESSIVE-REPRESENTATION-ANALYSIS.md'
      - 'research/reconstruction/PORTABLE-SNAPSHOT-LINEAGE-SURVIVAL-MAP.md'
      - '.github/workflows/progressive-evolution-record-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progressive-record-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/evolution-record-progressive-envelope/progressive_projector.py \
            research/prototypes/evolution-record-progressive-envelope/selftest_progressive_projector.py

      - name: Run deterministic progressive projection corpus
        run: python research/prototypes/evolution-record-progressive-envelope/selftest_progressive_projector.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=REPRESENTED_EVENT_ORDER_PROJECTION_EXTENSION_BOUNDARY_AND_HISTORY_DIGEST_ONLY'
          echo 'HISTORY_COMPLETENESS=UNPROVEN'
          echo 'SOURCE_AUTHENTICITY=UNPROVEN'
          echo 'PROJECTION_EQUIVALENCE_DOES_NOT_IMPLY_HISTORY_EQUIVALENCE=YES'
          echo 'CURRENT_CHANGE=NO'

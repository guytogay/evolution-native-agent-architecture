name: ENA v0.3.7 Release Residual Identity Audit

on:
  push:
    branches:
      - release/v0.3.7
    paths:
      - '.github/workflows/v037-release-residual-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory broad release-identity residuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,yaml
          root=Path('releases/current')
          suffixes={'.md','.yaml','.yml','.json','.py'}
          patterns={
            'working_candidate':re.compile(r'WORKING_CANDIDATE',re.I),
            'not_current':re.compile(r'NOT_CURRENT',re.I),
            'not_frozen':re.compile(r'NOT_FROZEN',re.I),
            'not_released':re.compile(r'NOT_RELEASED',re.I),
            'candidate_schema':re.compile(r'schema_version[^\n]{0,40}candidate',re.I),
            'v037_candidate_phrase':re.compile(r'v0\.3\.7[- ]candidate|candidate\.3',re.I),
            'old_current_phrase':re.compile(r'v0\.3\.6.{0,100}current|current.{0,100}v0\.3\.6',re.I),
            'current_change_no':re.compile(r'CURRENT_CHANGE\s*[=:]\s*NO',re.I),
            'candidate_baseline_path':re.compile(r'CANDIDATE-BASELINE\.yaml'),
          }
          for name,pat in patterns.items():
            hits=[]
            for p in sorted(x for x in root.rglob('*') if x.is_file() and x.suffix in suffixes):
              text=p.read_text(encoding='utf-8')
              if pat.search(text): hits.append(p.relative_to(root).as_posix())
            print('PATTERN',name,'COUNT',len(hits))
            for x in hits: print(' ',x)
          cur=yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert cur['ena_version']=='v0.3.7' and cur['adoption_status']=='CURRENT' and cur['current'] is True
          assert not (root/'CANDIDATE-BASELINE.yaml').exists()
          print('CURRENT_POINTER_V037=PASS')
          PY

      - name: Compare projection file set against frozen candidate source
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_SOURCE=b7e88d7adb70396bd671ca97066daf2c120e0adc
          git diff --name-status "$FROZEN_SOURCE:releases/v0.3.7-candidate" HEAD:releases/current
          echo V037_FROZEN_TO_RELEASE_PROJECTION_DIFF_EMITTED=PASS

      - name: Confirm audit is read-only
        run: test -z "$(git status --porcelain)"

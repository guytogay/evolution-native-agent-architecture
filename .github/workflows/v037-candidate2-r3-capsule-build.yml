name: ENA v0.3.7 Candidate.2 Isolated Review Capsule r3

on:
  workflow_dispatch:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-r3-capsule.trigger

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build capsule set first pass
        run: |
          set -euo pipefail
          python .github/scripts/build_v037_candidate2_independent_review_capsules_r3_1.py | tee /tmp/build1.log
          grep -q 'A_S_PRIMING_DETECTOR=HISTORY_SPECIFIC' /tmp/build1.log
          grep -q 'SEMANTIC_FAILURE_VOCABULARY_NE_AUTHOR_ATTACK_MAP' /tmp/build1.log
          grep -q 'CANDIDATE2_REVIEW_CAPSULE_R3_BUILD=PASS' /tmp/build1.log
          grep -q 'attack_cardinality=OPEN' /tmp/build1.log
          cp capsule-out/CAPSULE-HASHES.json /tmp/hashes-first.json

      - name: Audit A-S physical isolation
        run: |
          set -euo pipefail
          rm -rf /tmp/as-unpack
          mkdir -p /tmp/as-unpack
          unzip -q capsule-out/candidate2-as-capsule-r3.zip -d /tmp/as-unpack
          test -f /tmp/as-unpack/INTAKE-A-S.md
          test -f /tmp/as-unpack/MANIFEST-A-S.json
          test -d /tmp/as-unpack/releases/v0.3.7-candidate
          test ! -e /tmp/as-unpack/.github
          test ! -e /tmp/as-unpack/research
          test ! -e /tmp/as-unpack/collaboration
          test ! -e /tmp/as-unpack/releases/current
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/as-unpack')
          manifest = json.loads((root/'MANIFEST-A-S.json').read_text())
          c = root/'releases/v0.3.7-candidate'
          for rel in manifest['whole_file_exclusions_from_a_s']:
              if (c/rel).exists():
                  raise SystemExit(f'withheld path leaked into A-S capsule: {rel}')
          assert manifest['status'] == 'PHYSICALLY_ISOLATED_A_S_CAPSULE_R3'
          assert manifest['frozen_target']['source_commit'] == 'bda470e0a6b170cec61225a905957a501454a2fe'
          assert manifest['frozen_target']['candidate_subtree'] == 'd5fefc8c786d7e40b3e9a59211ee7045bccee5bf'
          print('A_S_PHYSICAL_ISOLATION=PASS')
          PY

      - name: Audit A-P exact frozen candidate package
        run: |
          set -euo pipefail
          rm -rf /tmp/ap-unpack /tmp/frozen
          mkdir -p /tmp/ap-unpack /tmp/frozen
          unzip -q capsule-out/candidate2-ap-supplement-r3.zip -d /tmp/ap-unpack
          git archive bda470e0a6b170cec61225a905957a501454a2fe releases/v0.3.7-candidate | tar -xf - -C /tmp/frozen
          diff -ruN /tmp/frozen/releases/v0.3.7-candidate /tmp/ap-unpack/releases/v0.3.7-candidate
          test -f /tmp/ap-unpack/INTAKE-A-P.md
          test -f /tmp/ap-unpack/MANIFEST-A-P.json
          test ! -e /tmp/ap-unpack/.github
          test ! -e /tmp/ap-unpack/research
          test ! -e /tmp/ap-unpack/collaboration
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/ap-unpack/MANIFEST-A-P.json').read_text())
          assert m['frozen_target']['source_commit'] == 'bda470e0a6b170cec61225a905957a501454a2fe'
          assert m['frozen_target']['candidate_subtree'] == 'd5fefc8c786d7e40b3e9a59211ee7045bccee5bf'
          print('A_P_EXACT_FROZEN_PACKAGE=PASS')
          PY

      - name: Rebuild and prove deterministic ZIP hashes
        run: |
          set -euo pipefail
          python .github/scripts/build_v037_candidate2_independent_review_capsules_r3_1.py | tee /tmp/build2.log
          cmp /tmp/hashes-first.json capsule-out/CAPSULE-HASHES.json
          sha256sum capsule-out/candidate2-as-capsule-r3.zip capsule-out/candidate2-ap-supplement-r3.zip
          cat capsule-out/CAPSULE-HASHES.json
          echo 'CAPSULE_DETERMINISM=PASS'

      - name: Upload A-S capsule
        uses: actions/upload-artifact@v4
        with:
          name: candidate2-as-capsule-r3
          path: capsule-out/candidate2-as-capsule-r3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload A-P supplement
        uses: actions/upload-artifact@v4
        with:
          name: candidate2-ap-supplement-r3
          path: capsule-out/candidate2-ap-supplement-r3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload capsule hashes
        uses: actions/upload-artifact@v4
        with:
          name: candidate2-capsule-r3-hashes
          path: capsule-out/CAPSULE-HASHES.json
          if-no-files-found: error
          retention-days: 30

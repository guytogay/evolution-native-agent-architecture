name: ENA v0.3.7 Candidate.2 r3 Python Priming Audit

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-r3-python-priming-audit.trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v037-c2-blind-semantic-primary-r2
          fetch-depth: 0
      - name: Bind r2 source
        run: test "$(git rev-parse HEAD)" = "9876be2e683d07a3b5bb4421618d3b2cb04dbda4"
      - name: Scan retained Python for prior-finding / author-map language
        run: |
          set -euo pipefail
          git grep -n -I -i -E 'false claim|false block|false OK|fixes P[0-9]+|fresh independent|prior[- ]falsifier|PR #[0-9]+|NEEDS_REVISION|REVALIDATION_BY|candidate[ ._-]*1|predecessor|successor|accepted through' -- 'releases/v0.3.7-candidate/**/*.py' 'releases/v0.3.7-candidate/*.py' || true

name: ENA v0.3.7 Release Identity Stage 2

on:
  push:
    branches: [release/v0.3.7]
    paths:
      - '.github/scripts/v037_release_identity_stage2.py'
      - '.github/workflows/v037-release-identity-stage2.yml'

permissions:
  contents: write

jobs:
  project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: release/v0.3.7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install transform dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Confirm stage1 release pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('releases/current')
          doc=yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['ena_version']=='v0.3.7' and doc['current'] is True
          assert not (root/'CANDIDATE-BASELINE.yaml').exists()
          print('V037_STAGE2_PRECONDITION=PASS')
          PY

      - name: Apply stage2 active-surface projection
        run: python .github/scripts/v037_release_identity_stage2.py

      - name: Enforce prose-metadata-only mutation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          explicit={
            'releases/current/00-READ-ME-FIRST.md','releases/current/05-CORE-OPERATIONAL-CONTRACTS.md',
            'releases/current/06-EVOLUTION-KNOWLEDGE-AND-OPEN-PARTICIPATION.md','releases/current/07-ADOPTION-AND-FIELD-VALIDATION.md',
            'releases/current/08-RELEASE-DISCIPLINE.md','releases/current/09-EVOLUTION-METABOLISM.md',
            'releases/current/10-LANGUAGE-PORTABILITY.md','releases/current/AGENT-ADOPTION-INSTRUCTION.md',
            'releases/current/LITE-ADOPTION-INSTRUCTION.md','releases/current/README.md','releases/current/RUNTIME-ADOPTION-KERNEL.md',
            'releases/current/CONTRIBUTION-PROTOCOL.md','releases/current/CONSTITUTION-CONCEPT-MAP.yaml',
            'releases/current/SEMANTIC-GLOSSARY.yaml','releases/current/language-projections/semantic-fixtures.v2.yaml',
            'releases/current/templates/field-experience.v2.yaml','releases/current/language-projections/zh-CN/01-CONSTITUTION.md',
            'releases/current/language-projections/zh-CN/CONSTITUTION-CONCEPT-MAP.md',
            'releases/current/language-projections/zh-CN/SEMANTIC-GLOSSARY.zh-CN.yaml',
            'releases/current/language-projections/zh-CN/00-READ-ME-FIRST.md',
            'releases/current/language-projections/zh-CN/09-EVOLUTION-METABOLISM.md',
            'releases/current/language-projections/zh-CN/REFERENCE-GUIDE.md',
            'releases/current/language-projections/zh-CN/RUNTIME-ADOPTION-KERNEL.md',
            'releases/current/language-projections/zh-CN/projection-manifest.yaml',
          }
          def allowed(path):
              p=Path(path)
              if path in explicit: return True
              if path.startswith('releases/current/operational/') and p.suffix=='.md': return True
              if path.startswith('releases/current/language-projections/zh-CN/operational/') and p.suffix=='.md': return True
              if path.startswith('releases/current/references/') and p.name=='README.md': return True
              return False
          bad=[x for x in changed if not allowed(x)]
          print('STAGE2_CHANGED',len(changed))
          for x in changed: print('CHANGED',x)
          if bad:
              print('UNEXPECTED',bad)
              raise SystemExit(1)
          if any(x.startswith('releases/current/tools/') for x in changed):
              raise SystemExit('stage2 must not mutate executable tool bytes')
          ref_machine=[x for x in changed if x.startswith('releases/current/references/') and not x.endswith('/README.md')]
          if ref_machine:
              raise SystemExit('stage2 must not mutate optional reference machine bytes: '+repr(ref_machine))
          print('V037_STAGE2_MUTATION_BOUNDARY=PASS')
          PY

      - name: Validate active identity without laundering optional-reference status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,yaml,re
          root=Path('releases/current')
          for rel in ['operational/README.md','operational/CUE-INDEX.md','operational/HOW-MAP.md',
                      'language-projections/zh-CN/operational/README.md']:
              head='\n'.join((root/rel).read_text(encoding='utf-8').splitlines()[:24])
              assert 'WORKING_CANDIDATE' not in head and 'NOT_CURRENT' not in head and 'NOT_FROZEN' not in head, rel
              assert 'CURRENT-BASELINE.yaml' in (root/'operational/README.md').read_text(encoding='utf-8')
          assert 'v0.3.7 Current projections' in (root/'SEMANTIC-GLOSSARY.yaml').read_text(encoding='utf-8')
          assert 'ena_semantic_identity: "v0.3.7"' in (root/'templates/field-experience.v2.yaml').read_text(encoding='utf-8')
          assert '# Contribution Protocol — v0.3.7 Current' in (root/'CONTRIBUTION-PROTOCOL.md').read_text(encoding='utf-8')
          zh=yaml.safe_load((root/'language-projections/zh-CN/projection-manifest.yaml').read_text(encoding='utf-8'))
          assert zh['validation']['structural_parity']=='CURRENT_DECISION_SURFACE_CHECKABLE'
          # Optional reference objects remain non-normative research prototypes even when bundled in Current.
          auth=json.loads((root/'references/general/authority-lease/authority-lease.v0.1.json').read_text(encoding='utf-8'))
          assert 'NOT_CURRENT' in auth['status'] and 'RESEARCH_PROTOTYPE' in auth['status']
          print('V037_STAGE2_IDENTITY_AND_REFERENCE_BOUNDARY=PASS')
          PY

      - name: Commit stage2 as one auditable occurrence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/current
          git commit -m 'release: project v0.3.7 active adoption surfaces stage 2'
          git push origin HEAD:release/v0.3.7

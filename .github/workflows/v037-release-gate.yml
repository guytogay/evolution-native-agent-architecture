name: ENA v0.3.7 Exact Release Gate

on:
  push:
    branches: [release/v0.3.7]
    paths:
      - '.github/workflows/v037-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-24.04
    env:
      FROZEN_SOURCE: b7e88d7adb70396bd671ca97066daf2c120e0adc
      FROZEN_TREE: e3a9a20d16cecd78df7f32f19fca56e21159e810
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Bind exact frozen source and Current release pointer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          frozen='b7e88d7adb70396bd671ca97066daf2c120e0adc'
          tree=subprocess.check_output(['git','rev-parse',f'{frozen}:releases/v0.3.7-candidate'],text=True).strip()
          assert tree=='e3a9a20d16cecd78df7f32f19fca56e21159e810'
          root=Path('releases/current')
          doc=yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['schema_version']=='3.1'
          assert doc['ena_version']=='v0.3.7'
          assert doc['adoption_status']=='CURRENT'
          assert doc['maturity']=='FIELD_VALIDATION'
          assert doc['current'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          assert doc['lineage']['frozen_candidate3_source_commit']==frozen
          assert doc['lineage']['frozen_candidate3_tree']==tree
          assert doc['lineage']['candidate_succession_stop'] is True
          assert doc['lineage']['candidate4_required_by_current_evidence'] is False
          assert not (root/'CANDIDATE-BASELINE.yaml').exists()
          print('V037_EXACT_BINDING_AND_CURRENT_POINTER=PASS')
          PY

      - name: Parse all Current JSON and YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,yaml
          root=Path('releases/current')
          for p in sorted(root.rglob('*.json')):
              json.loads(p.read_text(encoding='utf-8'))
          for p in sorted(root.rglob('*.yaml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
          print('CURRENT_PARSE_PASS')
          PY

      - name: Preserve frozen executable and optional-reference machine bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          frozen='b7e88d7adb70396bd671ca97066daf2c120e0adc'
          prefix='releases/v0.3.7-candidate/'
          root=Path('releases/current')
          def frozen_bytes(rel):
              return subprocess.check_output(['git','show',f'{frozen}:{prefix}{rel}'])
          checked=0
          for p in sorted((root/'tools').rglob('*')):
              if p.is_file():
                  rel=p.relative_to(root).as_posix()
                  assert p.read_bytes()==frozen_bytes(rel), f'executable/tool byte drift: {rel}'
                  checked+=1
          for p in sorted((root/'references').rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel=='references/REFERENCE-MANIFEST.yaml' or p.name=='README.md':
                  continue
              assert p.read_bytes()==frozen_bytes(rel), f'optional reference machine byte drift: {rel}'
              checked+=1
          for rel in ['01-CONSTITUTION.md','02-SELF-POSITIONING-AND-LOCAL-PROJECTION.md','03-ROLES-AND-DEVELOPMENTAL-STAGES.md','04-CAPABILITY-MAP.md','schemas/adaptation-packet.v2.schema.json']:
              assert (root/rel).read_bytes()==frozen_bytes(rel), f'frozen semantic-trunk byte drift: {rel}'
              checked+=1
          print('FROZEN_NON_PROJECTION_BYTE_PARITY_PASS',checked)
          PY

      - name: Prove identity-only semantic projections remain bounded
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib,json,subprocess
          frozen='b7e88d7adb70396bd671ca97066daf2c120e0adc'
          prefix='releases/v0.3.7-candidate/'
          root=Path('releases/current')
          def ftext(rel): return subprocess.check_output(['git','show',f'{frozen}:{prefix}{rel}']).decode()
          rel='05-CORE-OPERATIONAL-CONTRACTS.md'
          old=ftext(rel).splitlines(); new=(root/rel).read_text(encoding='utf-8').splitlines()
          for line in difflib.ndiff(old,new):
              if line.startswith(('- ','+ ')):
                  body=line[2:].lower()
                  assert any(tok in body for tok in ['candidate','current','v0.3.7','v0.3.6']), ('non-identity 05 drift',line)
          rel='schemas/evolution-record.v2.schema.json'
          old=json.loads(ftext(rel)); new=json.loads((root/rel).read_text(encoding='utf-8'))
          old['title']='NORMALIZED'; new['title']='NORMALIZED'
          assert old==new, 'evolution-record v2 changed beyond title identity projection'
          print('IDENTITY_ONLY_SEMANTIC_PROJECTION_PASS')
          PY

      - name: Validate Constitution and release navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('releases/current')
          ids=re.findall(r'ENA-CON-\d{3}',(root/'01-CONSTITUTION.md').read_text(encoding='utf-8'))
          assert ids==[f'ENA-CON-{i:03d}' for i in range(1,39)]
          mdlink=re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          broken=[]
          for p in root.rglob('*.md'):
              for raw in mdlink.findall(p.read_text(encoding='utf-8')):
                  target=raw.strip().split('#',1)[0].split('?',1)[0]
                  if not target or target.startswith(('http://','https://','mailto:','/')): continue
                  resolved=(p.parent/target).resolve()
                  try: resolved.relative_to(root.resolve())
                  except ValueError: continue
                  if not resolved.exists(): broken.append(f'{p.relative_to(root)} -> {raw}')
          assert not broken, broken[:20]
          print('CONSTITUTION_38_AND_RELATIVE_LINKS_PASS')
          PY

      - name: Run v2 record and practical helper selftests
        run: |
          python releases/current/tools/validate_evolution_record_v2.py --selftest | tee /tmp/v2-record.log
          grep -q 'EVOLUTION_RECORD_V2_SELFTEST_PASS 35' /tmp/v2-record.log
          python releases/current/tools/selftest_ena_evolve_v2.py | tee /tmp/v2-helper.log
          grep -q "'selftest': 'PASS'" /tmp/v2-helper.log
          grep -q "'cases': 13" /tmp/v2-helper.log

      - name: Run inherited composed-contract regression without result drift
        shell: bash
        run: |
          set -euo pipefail
          ROOT=releases/current
          python "$ROOT/tools/validate_contracts.py" selftest "$ROOT/tools/contract-fixtures.v1.json"
          python "$ROOT/tools/validate_contracts.py" selftest "$ROOT/tools/contract-fixtures.v2.json"
          python "$ROOT/tools/validate_contracts.py" selftest "$ROOT/tools/contract-fixtures.v2.1.json"
          cp "$ROOT/tools/regression-results-v033.json" /tmp/regression.before.json
          python "$ROOT/tools/regression_suite.py" | tee /tmp/regression.log
          grep -q 'inherited 164-case corpus : 164/164 passed (ZERO flips required)' /tmp/regression.log
          grep -q 'successor closure corpus  : 61/61 passed' /tmp/regression.log
          cmp /tmp/regression.before.json "$ROOT/tools/regression-results-v033.json"

      - name: Run legacy compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=releases/current/tools/legacy
          python "$ROOT/ena_evolve_v1_2.py" selftest
          python "$ROOT/candidate1_adversarial_v1_2.py"
          python "$ROOT/candidate2_adversarial_v1_2.py"

      - name: Run every bundled optional-reference selftest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find releases/current/references -type f \( -name 'selftest.py' -o -name 'selftest_*.py' \) -print0 | sort -z)
          test "${#files[@]}" -ge 8
          for f in "${files[@]}"; do
            echo "RUN_REFERENCE_SELFTEST=$f"
            python "$f"
          done
          echo "OPTIONAL_REFERENCE_SELFTEST_FILES=${#files[@]}"

      - name: Validate optional/default-off package boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,yaml
          root=Path('releases/current')
          ref=yaml.safe_load((root/'references/REFERENCE-MANIFEST.yaml').read_text(encoding='utf-8'))
          assert ref['status']=='CURRENT_OPTIONAL_REFERENCE_MANIFEST'
          assert ref['policy']['required_for_complete_adoption_default'] is False
          assert ref['policy']['default_activation_default'] is False
          assert ref['policy']['package_inclusion_implies_applicability'] is False
          assert ref['policy']['package_inclusion_implies_activation'] is False
          assert ref['policy']['host_native_equivalent_allowed'] is True
          for r in ref['references']:
              assert r['required_for_complete_adoption'] is False
              assert r['default_activation'] is False
          auth=json.loads((root/'references/general/authority-lease/authority-lease.v0.1.json').read_text(encoding='utf-8'))
          assert 'RESEARCH_PROTOTYPE' in auth['status'] and 'NOT_CURRENT' in auth['status']
          print('OPTIONAL_REFERENCE_BOUNDARY_PASS',len(ref['references']))
          PY

      - name: Validate English and zh-CN operational routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,re
          root=Path('releases/current')
          idx=yaml.safe_load((root/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8'))
          routes=set(idx['routes'])
          v3=yaml.safe_load((root/'language-projections/semantic-fixtures.v3.yaml').read_text(encoding='utf-8'))
          assert str(v3['schema_version'])=='3.0'
          cases=v3['cases']; assert len(cases)==12
          for c in cases:
              assert c['expected_route'] in routes
              assert c.get('en','').strip() and c.get('zh-CN','').strip()
              assert c.get('expected_properties')
          zh=yaml.safe_load((root/'language-projections/zh-CN/projection-manifest.yaml').read_text(encoding='utf-8'))
          assert zh['source_semantic_version']=='v0.3.7'
          assert zh['not_current'] is False
          assert zh['validation']['structural_parity']=='CURRENT_DECISION_SURFACE_CHECKABLE'
          assert zh['validation']['universal_behavioral_semantic_conformance']=='UNPROVEN'
          en_ids=re.findall(r'ENA-CON-\d{3}',(root/'01-CONSTITUTION.md').read_text(encoding='utf-8'))
          zh_ids=re.findall(r'ENA-CON-\d{3}',(root/'language-projections/zh-CN/01-CONSTITUTION.md').read_text(encoding='utf-8'))
          assert en_ids==zh_ids==[f'ENA-CON-{i:03d}' for i in range(1,39)]
          print('OPERATIONAL_AND_ZH_ROUTE_STRUCTURE_PASS',len(cases))
          PY

      - name: Validate adopter-facing active identity and truthful historical exceptions
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('releases/current')
          active=[
            'README.md','00-READ-ME-FIRST.md','05-CORE-OPERATIONAL-CONTRACTS.md',
            '06-EVOLUTION-KNOWLEDGE-AND-OPEN-PARTICIPATION.md','07-ADOPTION-AND-FIELD-VALIDATION.md',
            '09-EVOLUTION-METABOLISM.md','10-LANGUAGE-PORTABILITY.md','AGENT-ADOPTION-INSTRUCTION.md',
            'LITE-ADOPTION-INSTRUCTION.md','RUNTIME-ADOPTION-KERNEL.md','CONTRIBUTION-PROTOCOL.md',
            'operational/README.md','operational/CUE-INDEX.md','operational/HOW-MAP.md',
            'language-projections/zh-CN/00-READ-ME-FIRST.md','language-projections/zh-CN/RUNTIME-ADOPTION-KERNEL.md',
            'language-projections/zh-CN/operational/README.md'
          ]
          forbidden=['WORKING_CANDIDATE','NOT_CURRENT','NOT_FROZEN','CANDIDATE-BASELINE.yaml']
          for rel in active:
              text=(root/rel).read_text(encoding='utf-8')
              head='\n'.join(text.splitlines()[:30])
              for token in forbidden:
                  assert token not in head, (rel,token)
          # Historical lineage is allowed to say candidate/frozen/not-current truthfully.
          for rel in ['LINEAGE.md','CHANGELOG.md','08-RELEASE-DISCIPLINE.md']:
              assert 'candidate' in (root/rel).read_text(encoding='utf-8').lower()
          print('ACTIVE_IDENTITY_WITH_HISTORICAL_EXCEPTION_PASS')
          PY

      - name: Validate root release payload projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          readme=Path('README.md').read_text(encoding='utf-8')
          meta=yaml.safe_load(Path('PROJECT-METADATA.yaml').read_text(encoding='utf-8'))
          assert 'v0.3.7 is `FIELD_VALIDATION` in this release payload' in readme
          assert meta['current_validation']['current_version']=='v0.3.7'
          assert meta['entrypoints']['primary_v2_evolution_tool']=='releases/current/tools/ena_evolve_v2.py'
          assert meta['entrypoints']['inherited_reference_tool']=='releases/current/tools/legacy/ena_evolve_v1_2.py'
          print('ROOT_RELEASE_PAYLOAD_PROJECTION_PASS')
          PY

      - name: Compile Python and confirm validation leaves repository clean
        run: |
          python - <<'PY'
          from pathlib import Path
          failures=[]; files=sorted(Path('releases/current').rglob('*.py'))
          for p in files:
              try: compile(p.read_text(encoding='utf-8'),str(p),'exec')
              except Exception as exc: failures.append((str(p),repr(exc)))
          print('PYTHON_COMPILE_TOTAL',len(files),'FAILED',len(failures))
          assert not failures, failures
          PY
          found="$(find releases/current \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print)"
          test -z "$found"
          test -z "$(git status --porcelain)"

      - name: Build deterministic exact-head v0.3.7 Current package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          CURRENT_TREE="$(git rev-parse HEAD:releases/current)"
          rm -rf release-build
          mkdir -p release-build/current release-build/out
          git ls-tree -r --name-only "$SOURCE_COMMIT" releases/current | sort > release-build/source-paths.txt
          while IFS= read -r path; do
            rel="${path#releases/current/}"
            mkdir -p "release-build/current/$(dirname "$rel")"
            git show "$SOURCE_COMMIT:$path" > "release-build/current/$rel"
          done < release-build/source-paths.txt
          SOURCE_COMMIT="$SOURCE_COMMIT" CURRENT_TREE="$CURRENT_TREE" python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          root=Path('release-build/current'); out=Path('release-build/out')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(files)==118, f'unexpected Current file count: {len(files)}'
          hashes={}; zip_path=out/'ENA-v0.3.7-CURRENT.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for p in files:
                  rel=p.relative_to(root).as_posix(); data=p.read_bytes(); hashes[rel]=hashlib.sha256(data).hexdigest()
                  info=zipfile.ZipInfo(rel,(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  zf.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(zip_path) as zf:
              assert sorted(zf.namelist())==sorted(hashes)
              assert all(hashlib.sha256(zf.read(n)).hexdigest()==d for n,d in hashes.items())
          zsha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={'ena_version':'v0.3.7','status':'CURRENT','maturity':'FIELD_VALIDATION','source_commit':os.environ['SOURCE_COMMIT'],'current_tree':os.environ['CURRENT_TREE'],'frozen_candidate3_source':'b7e88d7adb70396bd671ca97066daf2c120e0adc','frozen_candidate3_tree':'e3a9a20d16cecd78df7f32f19fca56e21159e810','file_count':len(files),'file_sha256':hashes,'zip_sha256':zsha,'exact_file_set_parity':True,'zip_readback_hash_parity':True}
          (out/'ENA-v0.3.7-CURRENT.manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (out/'ENA-v0.3.7-CURRENT.zip.sha256').write_text(f'{zsha}  ENA-v0.3.7-CURRENT.zip\n',encoding='utf-8')
          print('PACKAGE_FILE_COUNT',len(files)); print('PACKAGE_SHA256',zsha); print('CURRENT_TREE',os.environ['CURRENT_TREE']); print('SOURCE_COMMIT',os.environ['SOURCE_COMMIT'])
          PY

      - name: Upload exact-head release package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ENA-v0.3.7-release-package
          path: |
            release-build/out/ENA-v0.3.7-CURRENT.zip
            release-build/out/ENA-v0.3.7-CURRENT.zip.sha256
            release-build/out/ENA-v0.3.7-CURRENT.manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Emit release evidence boundary
        run: |
          echo 'V037_EXACT_RELEASE_GATE=PASS'
          echo 'attack_cardinality=OPEN'
          echo 'external_truth=NOT_ESTABLISHED_BY_RELEASE_GATE'
          echo 'natural_host_salience=FIELD_EVIDENCE'
          echo 'bilingual_behavioral_equivalence=FIELD_OR_INDEPENDENT_EVIDENCE'
          echo 'promotion_authority=NOT_ASSIGNED_BY_THIS_WORKFLOW'

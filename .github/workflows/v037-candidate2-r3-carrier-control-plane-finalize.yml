name: ENA v0.3.7 Candidate.2 r3 Carrier Control-Plane Finalization

on:
  workflow_dispatch:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-r3-carrier-control-plane.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ena-reconstruction
          fetch-depth: 0

      - name: Apply exact carrier identity finalization
        run: |
          set -euo pipefail
          python .github/scripts/finalize_v037_candidate2_r3_carrier_control_plane.py | tee /tmp/finalize.log
          grep -q 'CANDIDATE2_R3_CARRIER_CONTROL_PLANE_FINALIZATION=PASS' /tmp/finalize.log
          grep -q 'authoritative_run=33131773164' /tmp/finalize.log
          grep -q 'manifest_self_hash=EXCLUDED_BY_DEFINITION' /tmp/finalize.log

      - name: Enforce mutation scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -E '^releases/'; then
            echo 'release cargo mutation forbidden' >&2
            exit 1
          fi
          if echo "$changed" | grep -Ev '^(research/ACTIVE-RESEARCH.yaml|research/plans/PROGRESS.yaml|research/handoffs/CURRENT-HANDOFF.yaml|research/handoffs/records/2026-08-28-v037-candidate2-isolated-as-capsule-ready/)'; then
            echo 'unexpected control-plane mutation' >&2
            exit 1
          fi

      - name: Commit aligned control plane
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE-RESEARCH.yaml research/plans/PROGRESS.yaml research/handoffs/CURRENT-HANDOFF.yaml research/handoffs/records/2026-08-28-v037-candidate2-isolated-as-capsule-ready/
          git diff --cached --quiet && { echo 'expected finalization diff missing' >&2; exit 1; }
          git commit -m 'control-plane: finalize candidate.2 isolated carrier r3 identity'
          git push origin HEAD:research/ena-reconstruction

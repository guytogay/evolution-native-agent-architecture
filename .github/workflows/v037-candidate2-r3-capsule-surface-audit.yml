name: ENA v0.3.7 Candidate.2 r3 Capsule Surface Audit

on:
  push:
    branches:
      - research/ena-reconstruction
    paths:
      - .github/candidate2-r3-capsule-surface-audit.trigger

permissions:
  contents: read

jobs:
  audit-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v037-c2-blind-semantic-primary-r2
          fetch-depth: 0

      - name: Bind r2 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9876be2e683d07a3b5bb4421618d3b2cb04dbda4"

      - name: Enumerate auto-renderable README surfaces
        run: |
          set -euo pipefail
          echo '=== README SURFACES ==='
          find releases/v0.3.7-candidate -type f \( -iname 'README.md' -o -iname 'README' \) -print | sort

      - name: Heuristic priming sweep over retained candidate surface
        run: |
          set -euo pipefail
          echo '=== HIGH-SIGNAL PRIMING HITS ==='
          git grep -n -I -i -E 'candidate[ ._-]*1|NEEDS_REVISION|Phase[ -]*B|pre[- ]?freeze|repair reconciliation|repair[_ -]run|author[- ]side|author attack|adversarial|expected[- ]?verdict|regression-results|330[0-9]{7,}' -- releases/v0.3.7-candidate || true
          echo '=== BROADER ORACLE/HISTORY WORD HITS (HEURISTIC ONLY) ==='
          git grep -n -I -i -E 'selftest|fixture|regression|freeze|reconciliation|lineage|expected outcome|oracle' -- releases/v0.3.7-candidate || true

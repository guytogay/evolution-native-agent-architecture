name: Lineage Compaction Retrieval Composition

on:
  pull_request:
    paths:
      - 'research/prototypes/lineage-compaction-retrieval-composition/**'
      - 'research/prototypes/lineage-compaction-contract/**'
      - 'research/prototypes/memory-metabolism/retrieval-obligation-0.5/**'
      - '.github/workflows/lineage-compaction-retrieval-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile composition tools
        run: |
          python -m py_compile \
            research/prototypes/lineage-compaction-retrieval-composition/validate_compaction_retrieval.py \
            research/prototypes/lineage-compaction-retrieval-composition/selftest_compaction_retrieval.py

      - name: Run cross-organ deterministic selftest
        run: |
          cd research/prototypes/lineage-compaction-retrieval-composition
          python selftest_compaction_retrieval.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'COLD_REF_PRESENT_NE_RETRIEVAL_SUFFICIENCY_NE_MATERIAL_USE_READY'
          echo 'EXTERNAL_RETRIEVABILITY=UNPROVEN'
          echo 'REGISTRY_COMPLETENESS=UNPROVEN'
          echo 'REAL_WORLD_FRESHNESS=UNPROVEN'
          echo 'CURRENT_CHANGE=NO'

name: Evidence Envelope Research

on:
  pull_request:
    paths:
      - 'research/prototypes/evidence-envelope/**'
      - '.github/workflows/evidence-envelope-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-envelope-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile research tools
        run: |
          python -m py_compile \
            research/prototypes/evidence-envelope/tools/validate_evidence_envelope.py \
            research/prototypes/evidence-envelope/tools/selftest_evidence_envelope.py

      - name: Run portable adversarial selftest
        run: python research/prototypes/evidence-envelope/tools/selftest_evidence_envelope.py

      - name: Verification boundary
        run: |
          echo 'PROTOTYPE_GATE=PASS'
          echo 'VERIFICATION_SCOPE=REPRESENTED_CONSISTENCY_AND_MUTATION_TESTS_ONLY'
          echo 'MECHANISM_RETENTION=APPLICABILITY,PROJECTION,ACTIVATION,WITNESS,DEPENDENCY'
          echo 'EXTERNAL_TRUTH=UNPROVEN'
          echo 'CURRENT_CHANGE=NO'

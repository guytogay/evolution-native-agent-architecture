name: ENA v0.3.7 Release Projection Surface Audit

on:
  push:
    branches:
      - release/v0.3.7
    paths:
      - '.github/workflows/v037-release-projection-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen transplant ancestry and current package state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 8e4e25a8ba1940560fc55d7528ad31ef89a7f135:releases/current)" = "e3a9a20d16cecd78df7f32f19fca56e21159e810"
          test -f releases/current/CANDIDATE-BASELINE.yaml
          test ! -f releases/current/CURRENT-BASELINE.yaml
          echo TRANSPLANT_OCCURRENCE_BINDING=PASS

      - name: Inventory active candidate and stale Current self-description surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('releases/current')
          suffixes = {'.md','.yaml','.yml','.json','.py'}
          candidate_header = []
          exact_identity = []
          old_current_header = []
          candidate_anywhere = []

          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.suffix in suffixes):
              text = p.read_text(encoding='utf-8')
              rel = p.relative_to(root).as_posix()
              head = '\n'.join(text.splitlines()[:20])
              if 'v0.3.7-candidate.3' in text:
                  exact_identity.append(rel)
              if re.search(r'WORKING_CANDIDATE|NOT_CURRENT|NOT_FROZEN|NOT_RELEASED|candidate\.3', head, re.I):
                  candidate_header.append(rel)
              if re.search(r'current.{0,80}v0\.3\.6|v0\.3\.6.{0,80}current', head, re.I):
                  old_current_header.append(rel)
              if re.search(r'v0\.3\.7[- ]candidate\.3|candidate\.3', text, re.I):
                  candidate_anywhere.append(rel)

          print('EXACT_IDENTITY_SURFACES', len(exact_identity))
          for x in exact_identity: print('EXACT', x)
          print('ACTIVE_CANDIDATE_HEADER_SURFACES', len(candidate_header))
          for x in candidate_header: print('ACTIVE_HEADER', x)
          print('OLD_CURRENT_HEADER_SURFACES', len(old_current_header))
          for x in old_current_header: print('OLD_CURRENT_HEADER', x)
          print('CANDIDATE_ANYWHERE_SURFACES', len(candidate_anywhere))
          for x in candidate_anywhere: print('CANDIDATE_ANYWHERE', x)

          for p in [Path('README.md'),Path('PROJECT-HUB.md'),Path('PROJECT-METADATA.yaml'),Path('HISTORY.md'),Path('.github/workflows/current-validate.yml')]:
              text=p.read_text(encoding='utf-8')
              print('ROOT_SCAN', p, 'v036=', text.count('v0.3.6'), 'candidate3=', len(re.findall(r'candidate\.3|v0\.3\.7-candidate\.3', text, re.I)))
          PY

      - name: Confirm audit is read-only
        run: test -z "$(git status --porcelain)"

name: Validate ENA Current

on:
  push:
    branches: [main]
    paths:
      - 'releases/current/**'
      - '.github/workflows/current-validate.yml'
  pull_request:
    paths:
      - 'releases/current/**'
      - '.github/workflows/current-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate Current identity and file set
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('releases/current')
          doc = yaml.safe_load((root / 'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          assert doc['ena_version'] == 'v0.3.7'
          assert doc['adoption_status'] == 'CURRENT'
          assert doc['maturity'] == 'FIELD_VALIDATION'
          assert doc['current'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          for rel in doc.get('core_files', []):
              assert (root / rel).is_file(), rel
          assert (root / doc['lite_entrypoint']).is_file()
          assert (root / doc['runtime_adoption']['kernel_entrypoint']).is_file()
          assert not (root / 'CANDIDATE-BASELINE.yaml').exists()
          print('CURRENT_IDENTITY_PASS', doc['ena_version'], doc['maturity'])
          PY

      - name: Parse Current JSON and YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root = Path('releases/current')
          for p in sorted(root.rglob('*.json')):
              json.loads(p.read_text(encoding='utf-8'))
          for p in sorted(root.rglob('*.yaml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
          print('CURRENT_STRUCTURED_PARSE_PASS')
          PY

      - name: Compile Current Python
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('releases/current').rglob('*.py'))
          failures = []
          for p in files:
              try:
                  compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              except Exception as exc:
                  failures.append((str(p), repr(exc)))
          assert not failures, failures
          print('CURRENT_PYTHON_COMPILE_PASS', len(files))
          PY

      - name: Run core semantic and evolution selftests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=releases/current
          python "$ROOT/tools/validate_contracts.py" selftest
          python "$ROOT/tools/validate_evolution_record_v2.py" --selftest
          python "$ROOT/tools/selftest_ena_evolve_v2.py"
          python "$ROOT/tools/regression_suite.py"

      - name: Run optional reference selftests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find releases/current/references -type f \( -name 'selftest.py' -o -name 'selftest_*.py' \) -print0 | sort -z)
          for f in "${files[@]}"; do
            echo "RUN_REFERENCE_SELFTEST=$f"
            python "$f"
          done
          echo "OPTIONAL_REFERENCE_SELFTEST_FILES=${#files[@]}"

      - name: Verify released v0.3.7 Constitution and tools remain frozen
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          frozen = 'b7e88d7adb70396bd671ca97066daf2c120e0adc'
          prefix = 'releases/v0.3.7-candidate/'
          root = Path('releases/current')
          protected = ['01-CONSTITUTION.md']
          protected += [p.relative_to(root).as_posix() for p in sorted((root / 'tools').rglob('*')) if p.is_file()]
          for rel in protected:
              expected = subprocess.check_output(['git', 'show', f'{frozen}:{prefix}{rel}'])
              assert (root / rel).read_bytes() == expected, rel
          print('V037_FROZEN_CORE_PASS', len(protected))
          PY

      - name: Reject generated bytecode or dirty validation output
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find releases/current \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print)"
          git status --porcelain
          test -z "$(git status --porcelain)"

name: Validate ENA Current

on:
  push:
    branches: [main]
    paths:
      - 'releases/current/**'
      - 'README.md'
      - 'PROJECT-METADATA.yaml'
      - '.github/workflows/current-validate.yml'
  pull_request:
    paths:
      - 'releases/current/**'
      - 'README.md'
      - 'PROJECT-METADATA.yaml'
      - '.github/workflows/current-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate Current identity, hot payload and R1 evolution-loop contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml

          root = Path('releases/current')
          doc = yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))

          assert doc['ena_version'] == 'v0.3.13'
          assert doc['adoption_status'] == 'CURRENT'
          assert doc['maturity'] == 'FIELD_VALIDATION'
          assert doc['current'] is True and doc['released'] is True
          assert doc['release_lane'] == 'R1_OPERATIONAL_EVOLUTION_LOOP'
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          assert doc['release_identity']['known_bounded_defect_must_be_fixed_before_recommending_current'] is True
          assert 'F-208-07_SEMANTIC_ADOPTION_DOES_NOT_RELIABLY_TRIGGER_LOCAL_OPERATIONALIZATION' in doc['lineage']['field_findings']
          assert 'F-208-08_EVOLUTION_VOCABULARY_WITHOUT_SUFFICIENTLY_EXECUTABLE_EVOLUTION_LOOP' in doc['lineage']['field_findings']

          for rel in doc['core_files']:
              assert (root/rel).is_file(), rel

          expected = ['RUNTIME-ADOPTION-KERNEL.md']
          a = doc['adoption_surface']
          r = doc['runtime_adoption']
          assert a['default_agent_hot_payload_count'] == 1
          assert a['default_agent_hot_payload'] == expected
          assert r['default_hot_payload_count'] == 1
          assert r['default_hot_payload'] == expected
          assert a['full_how_library_should_be_permanently_loaded'] is False
          assert r['hot_kernel_should_load_full_how_library'] is False
          assert a['bounded_local_operationalization_pass_after_adoption_or_host_change'] is True
          assert a['local_operationalization_may_install_every_control'] is False

          loop = doc['evolution_loop']
          assert loop['forced_continuous_self_editing'] is False
          assert loop['universal_metric_required'] is False
          assert loop['universal_runtime_required'] is False
          assert loop['full_lifecycle_engine_bundled'] is False
          assert loop['ena_evolve_v2_role'] == 'NARROW_LATENT_AND_MIGRATION_RECORD_PACKET_HELPER'
          assert len(loop['stages']) == 9
          assert len(loop['minimum_host_functions_when_applicable']) == 7
          assert doc['operational_architecture']['minimum_evolution_loop'] == 'operational/procedures/EVOLUTION-LOOP.md'

          root_readme = Path('README.md').read_text(encoding='utf-8')
          assert 'Current is **v0.3.13 / FIELD_VALIDATION**.' in root_readme
          assert 'operational/procedures/EVOLUTION-LOOP.md' in root_readme
          assert 'EVOLUTION_VOCABULARY != EXECUTABLE_EVOLUTION_LOOP' in root_readme

          meta = yaml.safe_load(Path('PROJECT-METADATA.yaml').read_text(encoding='utf-8'))
          assert meta['status'] == 'COLD_COMPATIBILITY_POINTER'
          assert meta['not_live_project_state'] is True
          assert meta['rules']['default_agent_hot_payload_count'] == 1
          assert meta['rules']['default_agent_hot_payload'] == 'releases/current/RUNTIME-ADOPTION-KERNEL.md'

          bootstrap = (root/'AGENT-ADOPTION-INSTRUCTION.md').read_text(encoding='utf-8')
          quick = (root/'ADOPTER-QUICKSTART.md').read_text(encoding='utf-8')
          kernel = (root/'RUNTIME-ADOPTION-KERNEL.md').read_text(encoding='utf-8')
          for text in (bootstrap, quick, kernel):
              assert 'operationalization' in text.lower()
          assert 'how do I improve/evolve myself' in kernel
          assert 'LOCAL_OPERATIONALIZATION != INSTALL_EVERY_CONTROL' in kernel
          assert 'EVOLUTION-LOOP.md' in kernel
          assert 'DEFAULT_AGENT_HOT_PAYLOAD' in kernel
          assert 'AVAILABLE_RESOURCE != DEFAULT_HOT_PAYLOAD' in kernel

          stable_no_numeric_current = [
              'README.md','00-READ-ME-FIRST.md','ADOPTER-QUICKSTART.md',
              'AGENT-ADOPTION-INSTRUCTION.md','RUNTIME-ADOPTION-KERNEL.md',
              'LITE-ADOPTION-INSTRUCTION.md','CONTRIBUTION-PROTOCOL.md',
              '06-EVOLUTION-KNOWLEDGE-AND-OPEN-PARTICIPATION.md',
              '07-ADOPTION-AND-FIELD-VALIDATION.md','08-RELEASE-DISCIPLINE.md',
              '09-EVOLUTION-METABOLISM.md','10-LANGUAGE-PORTABILITY.md',
              'language-projections/zh-CN/00-READ-ME-FIRST.md',
              'language-projections/zh-CN/RUNTIME-ADOPTION-KERNEL.md',
          ]
          numeric = re.compile(r'v0\.3\.\d+')
          for rel in stable_no_numeric_current:
              text = (root/rel).read_text(encoding='utf-8')
              hit = numeric.search(text)
              assert not hit, (rel, hit.group(0) if hit else None)

          contribution = (root/'CONTRIBUTION-PROTOCOL.md').read_text(encoding='utf-8')
          assert 'material defect in v0.3.7' not in contribution
          assert 'material defect in Current' in contribution

          print('CURRENT_R1_EVOLUTION_IDENTITY_PASS', doc['ena_version'])
          PY

      - name: Validate evolution-loop routing and bilingual projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml

          r = Path('releases/current')
          z = r/'language-projections/zh-CN'
          baseline = yaml.safe_load((r/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          manifest = yaml.safe_load((z/'projection-manifest.yaml').read_text(encoding='utf-8'))

          assert manifest['source_semantic_version'] == baseline['ena_version'] == 'v0.3.13'
          assert manifest['release_identity']['current_version'] == 'v0.3.13'
          assert manifest['release_identity']['current_status'] == 'CURRENT'
          assert manifest['runtime_adoption']['how_to_evolve_runtime_cue_present'] is True
          assert manifest['runtime_adoption']['local_operationalization_cue_present'] is True
          assert manifest['validation']['evolution_loop_projection_present'] is True
          assert 'operational/procedures/EVOLUTION-LOOP.md' in manifest['coverage']['version_neutral_semantic_projection']

          en_loop = (r/'operational/procedures/EVOLUTION-LOOP.md').read_text(encoding='utf-8')
          zh_loop = (z/'operational/procedures/EVOLUTION-LOOP.md').read_text(encoding='utf-8')
          cue = (r/'operational/CUE-INDEX.md').read_text(encoding='utf-8')
          how = (r/'operational/HOW-MAP.md').read_text(encoding='utf-8')
          ref = yaml.safe_load((r/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8'))
          kernel = (r/'RUNTIME-ADOPTION-KERNEL.md').read_text(encoding='utf-8')
          zkernel = (z/'RUNTIME-ADOPTION-KERNEL.md').read_text(encoding='utf-8')
          zcue = (z/'operational/CUE-INDEX.md').read_text(encoding='utf-8')
          zhow = (z/'operational/HOW-MAP.md').read_text(encoding='utf-8')
          metabolism = (r/'09-EVOLUTION-METABOLISM.md').read_text(encoding='utf-8')
          zmetabolism = (z/'09-EVOLUTION-METABOLISM.md').read_text(encoding='utf-8')

          assert 'EVOLUTION_VOCABULARY != EXECUTABLE_EVOLUTION_LOOP' in en_loop
          assert 'EVOLUTION_LOOP != CONTINUOUS_SELF_EDITING' in en_loop
          for marker in ['Capture the signal durably','keep it latent by default','reality contact','Establish the minimum before-state','Observe outcomes','Act on selection','Keep the loop alive']:
              assert marker.lower() in en_loop.lower(), marker
          for function in ['signal/inbox','candidate store','reality-contact surface','before/after evidence','recovery when material','selection record','wake/review']:
              assert function in en_loop, function

          assert 'EVOLUTION-LOOP.md' in kernel
          assert 'EVOLUTION-LOOP.md' in cue
          assert 'EVOLUTION-LOOP.md' in how
          evo_route = ref['routes']['OA-EVO-01']
          assert '../operational/procedures/EVOLUTION-LOOP.md' in evo_route.get('primary', []) or 'procedures/EVOLUTION-LOOP.md' in evo_route.get('primary', [])
          assert evo_route.get('tool_state') == 'NARROW_HELPER_NOT_FULL_LIFECYCLE_ENGINE'
          assert 'EVOLUTION-LOOP.md' in metabolism

          assert 'EVOLUTION-LOOP.md' in zkernel
          assert 'EVOLUTION-LOOP.md' in zcue
          assert 'EVOLUTION-LOOP.md' in zhow
          assert 'EVOLUTION-LOOP.md' in zmetabolism
          assert '持续自我修改' in zh_loop or '持续自改' in zh_loop

          z00 = (z/'00-READ-ME-FIRST.md').read_text(encoding='utf-8')
          assert 'CURRENT / FIELD_VALIDATION' in z00
          assert '默认唯一常驻' in zkernel
          assert not re.search(r'v0\.3\.\d+', z00)
          assert not re.search(r'v0\.3\.\d+', zkernel)

          print('EVOLUTION_LOOP_ROUTING_BILINGUAL_PASS')
          PY

      - name: Validate operational identity, templates and cold-surface version discipline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml
          r = Path('releases/current')
          z = r/'language-projections/zh-CN'
          numeric = re.compile(r'v0\.3\.\d+')

          zh_cold = [
              '01-CONSTITUTION.md','CONSTITUTION-CONCEPT-MAP.md','SEMANTIC-GLOSSARY.zh-CN.yaml',
              'REFERENCE-GUIDE.md','operational/README.md','operational/CUE-INDEX.md','operational/HOW-MAP.md',
              'operational/procedures/EVOLUTION-LOOP.md','operational/procedures/PURPOSE-RELATIVE-CONTINUITY.md',
              'operational/procedures/STANDING-INPUT.md','operational/procedures/CONTROL-RETIREMENT.md',
              'operational/patterns/EVOLUTION-COMMONS.md','operational/patterns/HOST-MAPPINGS.md',
              '09-EVOLUTION-METABOLISM.md',
          ]
          stale = ['v0.3.7 Current','CURRENT_CHANGE = NO']
          for rel in zh_cold:
              text = (z/rel).read_text(encoding='utf-8')
              found = [s for s in stale if s in text]
              assert not found, (rel, found)
              header = '\n'.join(text.splitlines()[:4])
              hit = numeric.search(header)
              assert not hit, (rel, hit.group(0) if hit else None)

          version_bound_current = re.compile(r'v0\.3\.\d+\s+Current', re.I)
          for p in r.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.md','.yaml','.json'}:
                  if p.name in {'CHANGELOG.md','LINEAGE.md','CURRENT-BASELINE.yaml'}:
                      continue
                  text = p.read_text(encoding='utf-8')
                  hit = version_bound_current.search(text)
                  assert not hit, (str(p), hit.group(0) if hit else None)

          enf_text = (r/'ENFORCEMENT-MAP.yaml').read_text(encoding='utf-8')
          enf = yaml.safe_load(enf_text)
          assert enf['status'] == 'CURRENT'
          assert 'CANDIDATE_NOT_CURRENT' not in enf_text

          ri_text = (r/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8')
          assert 'release: v0.3.' not in ri_text
          assert 'HOW-MAP.md#' not in ri_text

          t2 = yaml.safe_load((r/'templates/field-experience.v2.yaml').read_text(encoding='utf-8'))
          assert t2['participant']['ena_semantic_identity'] == 'EXPLICITLY_STATE_ACTUAL_SEMANTIC_IDENTITY'
          print('OPERATIONAL_IDENTITY_TEMPLATE_PASS')
          PY

      - name: Parse Current structured files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root = Path('releases/current')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8'))
          yaml.safe_load(Path('PROJECT-METADATA.yaml').read_text(encoding='utf-8'))
          print('CURRENT_STRUCTURED_PARSE_PASS')
          PY

      - name: Validate Constitution parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('releases/current')
          expected = [f'ENA-CON-{i:03d}' for i in range(1,39)]
          en = re.findall(r'ENA-CON-\d{3}', (root/'01-CONSTITUTION.md').read_text(encoding='utf-8'))
          zh = re.findall(r'ENA-CON-\d{3}', (root/'language-projections/zh-CN/01-CONSTITUTION.md').read_text(encoding='utf-8'))
          assert en == zh == expected
          print('CONSTITUTION_PARITY_PASS', len(en))
          PY

      - name: Run Current semantic and evolution selftests
        shell: bash
        run: |
          set -euo pipefail
          R=releases/current
          python "$R/tools/validate_contracts.py" selftest
          python "$R/tools/validate_evolution_record_v2.py" --selftest
          python "$R/tools/selftest_ena_evolve_v2.py"
          python "$R/tools/regression_suite.py"
          python "$R/tools/legacy/ena_evolve_v1_2.py" selftest
          python "$R/tools/legacy/candidate1_adversarial_v1_2.py"
          python "$R/tools/legacy/candidate2_adversarial_v1_2.py"

      - name: Run optional reference selftests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do python "$f"; done < <(find releases/current/references -type f \( -name 'selftest.py' -o -name 'selftest_*.py' \) -print0 | sort -z)

      - name: Validate optionality, enforcement and bilingual routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          r = Path('releases/current')
          ref = yaml.safe_load((r/'references/REFERENCE-MANIFEST.yaml').read_text(encoding='utf-8'))['policy']
          assert ref['required_for_complete_adoption_default'] is False
          assert ref['default_activation_default'] is False
          assert ref['host_native_equivalent_allowed'] is True
          enf = yaml.safe_load((r/'ENFORCEMENT-MAP.yaml').read_text(encoding='utf-8'))
          req = {'MODEL_CUE','MACHINE_GUARD','EXTERNAL_CONTROL_REQUIRED','FIELD_EVIDENCE_REQUIRED'}
          assert req.issubset(set(enf['classes']))
          routes = set(yaml.safe_load((r/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8'))['routes'])
          fx = yaml.safe_load((r/'language-projections/semantic-fixtures.v3.yaml').read_text(encoding='utf-8'))
          assert len(fx['cases']) >= 18
          for c in fx['cases']:
              assert c['expected_route'] in routes and c['en'].strip() and c['zh-CN'].strip()
          print('ADOPTION_CONFORMANCE_PASS', len(fx['cases']))
          PY

      - name: Verify R1 protected semantic and machine bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          r = Path('releases/current')
          c = Path('releases/v0.3.8-candidate')
          protected = [
              '01-CONSTITUTION.md',
              '02-SELF-POSITIONING-AND-LOCAL-PROJECTION.md',
              '03-ROLES-AND-DEVELOPMENTAL-STAGES.md',
              'tools/ena_evolve_v2.py',
              'tools/validate_evolution_record_v2.py',
              'tools/validate_contracts.py',
              'schemas/adaptation-packet.v2.schema.json',
          ]
          for rel in protected:
              assert (r/rel).read_bytes() == (c/rel).read_bytes(), rel
          cap_now = re.findall(r'ENA-CAP-\d{3}', (r/'04-CAPABILITY-MAP.md').read_text(encoding='utf-8'))
          cap_old = re.findall(r'ENA-CAP-\d{3}', (c/'04-CAPABILITY-MAP.md').read_text(encoding='utf-8'))
          assert cap_now == cap_old
          schema_now = json.loads((r/'schemas/evolution-record.v2.schema.json').read_text(encoding='utf-8'))
          schema_old = json.loads((c/'schemas/evolution-record.v2.schema.json').read_text(encoding='utf-8'))
          schema_now['title'] = schema_old['title']
          assert schema_now == schema_old
          print('R1_PROTECTED_SEMANTIC_MACHINE_PASS', len(protected), len(cap_now))
          PY

      - name: Reject generated bytecode or dirty validation output
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find releases/current \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print)"
          test -z "$(git status --porcelain)"

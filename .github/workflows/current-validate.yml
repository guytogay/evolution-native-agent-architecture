name: Validate ENA Current

on:
  push:
    branches: [main]
    paths:
      - 'releases/current/**'
      - 'README.md'
      - 'PROJECT-METADATA.yaml'
      - '.github/workflows/current-validate.yml'
  pull_request:
    paths:
      - 'releases/current/**'
      - 'README.md'
      - 'PROJECT-METADATA.yaml'
      - '.github/workflows/current-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate Current identity, hot payload and share-ready contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml

          root = Path('releases/current')
          doc = yaml.safe_load((root/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))

          assert doc['ena_version'] == 'v0.3.11'
          assert doc['adoption_status'] == 'CURRENT'
          assert doc['maturity'] == 'FIELD_VALIDATION'
          assert doc['current'] is True and doc['released'] is True
          assert doc['complete_adoption_baseline'] is True
          assert doc['requires_older_release_composition'] is False
          assert doc['release_identity']['known_bounded_defect_must_be_fixed_before_recommending_current'] is True

          for rel in doc['core_files']:
              assert (root/rel).is_file(), rel

          expected = ['RUNTIME-ADOPTION-KERNEL.md']
          a = doc['adoption_surface']
          r = doc['runtime_adoption']
          assert a['default_agent_hot_payload_count'] == 1
          assert a['default_agent_hot_payload'] == expected
          assert r['default_hot_payload_count'] == 1
          assert r['default_hot_payload'] == expected
          assert a['full_how_library_should_be_permanently_loaded'] is False
          assert r['hot_kernel_should_load_full_how_library'] is False

          root_readme = Path('README.md').read_text(encoding='utf-8')
          assert 'Current is **v0.3.11 / FIELD_VALIDATION**.' in root_readme
          assert 'DEFAULT_AGENT_HOT_PAYLOAD = RUNTIME-ADOPTION-KERNEL.md' in root_readme

          meta = yaml.safe_load(Path('PROJECT-METADATA.yaml').read_text(encoding='utf-8'))
          assert meta['status'] == 'COLD_COMPATIBILITY_POINTER'
          assert meta['not_live_project_state'] is True
          assert meta['rules']['default_agent_hot_payload_count'] == 1
          assert meta['rules']['default_agent_hot_payload'] == 'releases/current/RUNTIME-ADOPTION-KERNEL.md'

          bootstrap = (root/'AGENT-ADOPTION-INSTRUCTION.md').read_text(encoding='utf-8')
          kernel = (root/'RUNTIME-ADOPTION-KERNEL.md').read_text(encoding='utf-8')
          assert 'bootstrap' in bootstrap.lower()
          assert 'DEFAULT_AGENT_HOT_PAYLOAD' in kernel
          assert 'AVAILABLE_RESOURCE != DEFAULT_HOT_PAYLOAD' in kernel

          stable_no_numeric_current = [
              'README.md',
              '00-READ-ME-FIRST.md',
              'ADOPTER-QUICKSTART.md',
              'AGENT-ADOPTION-INSTRUCTION.md',
              'RUNTIME-ADOPTION-KERNEL.md',
              'LITE-ADOPTION-INSTRUCTION.md',
              'CONTRIBUTION-PROTOCOL.md',
              '07-ADOPTION-AND-FIELD-VALIDATION.md',
              '08-RELEASE-DISCIPLINE.md',
              '09-EVOLUTION-METABOLISM.md',
              '10-LANGUAGE-PORTABILITY.md',
              'language-projections/zh-CN/00-READ-ME-FIRST.md',
              'language-projections/zh-CN/RUNTIME-ADOPTION-KERNEL.md',
          ]
          numeric = re.compile(r'v0\.3\.\d+')
          for rel in stable_no_numeric_current:
              text = (root/rel).read_text(encoding='utf-8')
              hit = numeric.search(text)
              assert not hit, (rel, hit.group(0) if hit else None)

          contribution = (root/'CONTRIBUTION-PROTOCOL.md').read_text(encoding='utf-8')
          assert 'material defect in v0.3.7' not in contribution
          assert 'material defect in Current' in contribution

          print('CURRENT_IDENTITY_HOT_PAYLOAD_SHARE_READY_PASS', doc['ena_version'])
          PY

      - name: Validate root and zh-CN release/adoption identity parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml

          r = Path('releases/current')
          z = r/'language-projections/zh-CN'
          baseline = yaml.safe_load((r/'CURRENT-BASELINE.yaml').read_text(encoding='utf-8'))
          manifest = yaml.safe_load((z/'projection-manifest.yaml').read_text(encoding='utf-8'))

          assert manifest['source_semantic_version'] == baseline['ena_version'] == 'v0.3.11'
          assert manifest['release_identity']['current_version'] == 'v0.3.11'
          assert manifest['release_identity']['current_status'] == 'CURRENT'
          assert manifest['runtime_adoption']['default_agent_hot_payload_count'] == 1
          assert manifest['runtime_adoption']['default_agent_hot_payload'] == ['RUNTIME-ADOPTION-KERNEL.md']
          assert manifest['coverage']['release_bound_projection'] == ['projection-manifest.yaml']

          z00 = (z/'00-READ-ME-FIRST.md').read_text(encoding='utf-8')
          zk = (z/'RUNTIME-ADOPTION-KERNEL.md').read_text(encoding='utf-8')
          assert 'CURRENT / FIELD_VALIDATION' in z00
          assert '默认唯一常驻' in zk
          assert not re.search(r'v0\.3\.\d+', z00)
          assert not re.search(r'v0\.3\.\d+', zk)

          cold = [
              '01-CONSTITUTION.md',
              'CONSTITUTION-CONCEPT-MAP.md',
              'SEMANTIC-GLOSSARY.zh-CN.yaml',
              'REFERENCE-GUIDE.md',
              'operational/README.md',
              'operational/CUE-INDEX.md',
              'operational/HOW-MAP.md',
              'operational/procedures/PURPOSE-RELATIVE-CONTINUITY.md',
              'operational/procedures/STANDING-INPUT.md',
              'operational/procedures/CONTROL-RETIREMENT.md',
              'operational/patterns/EVOLUTION-COMMONS.md',
              'operational/patterns/HOST-MAPPINGS.md',
          ]
          stale = ['v0.3.7 Current', 'Candidate Assembly Gate', 'CURRENT_CHANGE = NO']
          for rel in cold:
              text = (z/rel).read_text(encoding='utf-8')
              found = [s for s in stale if s in text]
              assert not found, (rel, found)

          en_cold = ['releases/current/CONTRIBUTION-PROTOCOL.md', 'releases/current/references/general/wait-state/README.md', 'releases/current/references/general/authority-lease/README.md', 'releases/current/references/general/effect-lifecycle/README.md', 'releases/current/references/general/recovery-adapter/README.md', 'releases/current/references/advanced/evidence-envelope/README.md', 'releases/current/references/general/retrieval-obligation/README.md', 'releases/current/references/advanced/contested-authorship/README.md', 'releases/current/references/advanced/evidence-dependency-map/README.md', 'releases/current/operational/procedures/STANDING-INPUT.md', 'releases/current/05-CORE-OPERATIONAL-CONTRACTS.md', 'releases/current/operational/patterns/HOST-MAPPINGS.md', 'releases/current/operational/patterns/EVOLUTION-COMMONS.md', 'releases/current/operational/procedures/CONTROL-RETIREMENT.md', 'releases/current/operational/procedures/PURPOSE-RELATIVE-CONTINUITY.md', 'releases/current/SEMANTIC-GLOSSARY.yaml', 'releases/current/references/REFERENCE-MANIFEST.yaml', 'releases/current/schemas/evolution-record.v2.schema.json', 'releases/current/language-projections/semantic-fixtures.v2.yaml', 'releases/current/templates/field-experience.v2.yaml', 'releases/current/04-CAPABILITY-MAP.md']
          version_bound_current = re.compile(r'v0\.3\.\d+\s+Current', re.I)
          for rel in en_cold:
              text = Path(rel).read_text(encoding='utf-8')
              hit = version_bound_current.search(text)
              assert not hit, (rel, hit.group(0) if hit else None)
          assert 'v0.3.6 candidate' not in (r/'04-CAPABILITY-MAP.md').read_text(encoding='utf-8')

          print('ROOT_ZH_RELEASE_IDENTITY_PARITY_PASS')
          PY

      - name: Parse Current structured files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root = Path('releases/current')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8'))
          yaml.safe_load(Path('PROJECT-METADATA.yaml').read_text(encoding='utf-8'))
          print('CURRENT_STRUCTURED_PARSE_PASS')
          PY

      - name: Validate Constitution parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('releases/current')
          expected = [f'ENA-CON-{i:03d}' for i in range(1,39)]
          en = re.findall(r'ENA-CON-\d{3}', (root/'01-CONSTITUTION.md').read_text(encoding='utf-8'))
          zh = re.findall(r'ENA-CON-\d{3}', (root/'language-projections/zh-CN/01-CONSTITUTION.md').read_text(encoding='utf-8'))
          assert en == zh == expected
          print('CONSTITUTION_PARITY_PASS', len(en))
          PY

      - name: Run Current semantic and evolution selftests
        shell: bash
        run: |
          set -euo pipefail
          R=releases/current
          python "$R/tools/validate_contracts.py" selftest
          python "$R/tools/validate_evolution_record_v2.py" --selftest
          python "$R/tools/selftest_ena_evolve_v2.py"
          python "$R/tools/regression_suite.py"
          python "$R/tools/legacy/ena_evolve_v1_2.py" selftest
          python "$R/tools/legacy/candidate1_adversarial_v1_2.py"
          python "$R/tools/legacy/candidate2_adversarial_v1_2.py"

      - name: Run optional reference selftests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do python "$f"; done < <(find releases/current/references -type f \( -name 'selftest.py' -o -name 'selftest_*.py' \) -print0 | sort -z)

      - name: Validate optionality, enforcement and bilingual routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          r = Path('releases/current')
          ref = yaml.safe_load((r/'references/REFERENCE-MANIFEST.yaml').read_text(encoding='utf-8'))['policy']
          assert ref['required_for_complete_adoption_default'] is False
          assert ref['default_activation_default'] is False
          assert ref['host_native_equivalent_allowed'] is True
          enf = yaml.safe_load((r/'ENFORCEMENT-MAP.yaml').read_text(encoding='utf-8'))
          req = {'MODEL_CUE','MACHINE_GUARD','EXTERNAL_CONTROL_REQUIRED','FIELD_EVIDENCE_REQUIRED'}
          assert req.issubset(set(enf['classes']))
          routes = set(yaml.safe_load((r/'operational/REFERENCE-INDEX.yaml').read_text(encoding='utf-8'))['routes'])
          fx = yaml.safe_load((r/'language-projections/semantic-fixtures.v3.yaml').read_text(encoding='utf-8'))
          assert len(fx['cases']) >= 18
          for c in fx['cases']:
              assert c['expected_route'] in routes and c['en'].strip() and c['zh-CN'].strip()
          print('ADOPTION_CONFORMANCE_PASS', len(fx['cases']))
          PY

      - name: Verify R0 protected semantic and machine bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          r = Path('releases/current')
          c = Path('releases/v0.3.8-candidate')
          protected = [
              '01-CONSTITUTION.md',
              '02-SELF-POSITIONING-AND-LOCAL-PROJECTION.md',
              '03-ROLES-AND-DEVELOPMENTAL-STAGES.md',
              'tools/ena_evolve_v2.py',
              'tools/validate_evolution_record_v2.py',
              'tools/validate_contracts.py',
              'schemas/adaptation-packet.v2.schema.json',
          ]
          for rel in protected:
              assert (r/rel).read_bytes() == (c/rel).read_bytes(), rel
          print('R0_PROTECTED_BYTES_PASS', len(protected))
          import json, re
          cap_now = re.findall(r'ENA-CAP-\d{3}', (r/'04-CAPABILITY-MAP.md').read_text(encoding='utf-8'))
          cap_old = re.findall(r'ENA-CAP-\d{3}', (c/'04-CAPABILITY-MAP.md').read_text(encoding='utf-8'))
          assert cap_now == cap_old
          schema_now = json.loads((r/'schemas/evolution-record.v2.schema.json').read_text(encoding='utf-8'))
          schema_old = json.loads((c/'schemas/evolution-record.v2.schema.json').read_text(encoding='utf-8'))
          schema_now['title'] = schema_old['title']
          assert schema_now == schema_old
          print('R0_METADATA_NORMALIZED_SEMANTIC_PASS', len(cap_now))
          PY

      - name: Reject generated bytecode or dirty validation output
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find releases/current \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print)"
          test -z "$(git status --porcelain)"

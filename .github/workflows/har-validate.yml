name: Validate ENA research records

on:
  push:
    paths:
      - 'research/adversarial-replay/**'
      - 'research/prototypes/**'
      - '.github/workflows/har-validate.yml'
  pull_request:
    paths:
      - 'research/adversarial-replay/**'
      - 'research/prototypes/**'
      - '.github/workflows/har-validate.yml'

jobs:
  validate-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate HAR case structure
        run: python research/adversarial-replay/tools/validate_cases.py

      - name: Validate Evidence Applicability prototypes
        run: python research/prototypes/validate_applicability.py

name: ENA v0.3.6 Candidate Validate

on:
  push:
    branches:
      - candidate/v0.3.6-candidate
    paths:
      - 'releases/v0.3.6-candidate/**'
      - 'collaboration/inbox/2026-08-23-v036-**'
      - 'collaboration/reconciliation/2026-08-23-v036-**'
      - 'collaboration/reconciliation/2026-08-24-v036-**'
      - '.github/workflows/v036-candidate-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/v0.3.6-candidate/**'
      - 'collaboration/inbox/2026-08-23-v036-**'
      - 'collaboration/reconciliation/2026-08-23-v036-**'
      - 'collaboration/reconciliation/2026-08-24-v036-**'
      - '.github/workflows/v036-candidate-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v036-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-validate:
    name: v036-candidate-pre-freeze
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Run v0.3.6 candidate pre-freeze validator
        run: python releases/v0.3.6-candidate/tools/validate_candidate.py

      - name: Exercise v2 latent/expression consistency attacks
        run: python releases/v0.3.6-candidate/tools/validate_evolution_record_v2.py --selftest

      - name: Preserve inherited composed-validator regression corpus
        run: python releases/v0.3.6-candidate/tools/regression_suite.py

      - name: Compile candidate Python tools without writing pyc
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('releases/v0.3.6-candidate/tools')
          files = sorted(root.glob('*.py'))
          failed = []
          for path in files:
              try:
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
              except Exception as exc:
                  failed.append((str(path), repr(exc)))
          print(f'PYTHON_COMPILE_TOTAL {len(files)}')
          print(f'PYTHON_COMPILE_FAILED {len(failed)}')
          for path, exc in failed:
              print(path, exc)
          if failed:
              raise SystemExit(1)
          PY

      - name: Verify no Python bytecode artifacts were produced
        run: |
          found="$(find releases/v0.3.6-candidate -type d -name '__pycache__' -o -type f -name '*.pyc')"
          if [ -n "$found" ]; then
            echo "$found"
            exit 1
          fi

      - name: Verify validation did not dirty repository
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Explain evidence boundary
        run: |
          echo 'PASS means represented candidate structure/identity, v2 consistency, inherited composed-validator regression, tool syntax, no Python bytecode artifacts, and Current isolation are consistent within this workflow.'
          echo 'PASS does not prove external evidence truth, future salience, ecological fitness, moral convergence, authority/recovery reality, or independent semantic acceptance.'

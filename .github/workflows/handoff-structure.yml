name: Handoff Structure

on:
  pull_request:
    paths:
      - 'research/handoffs/**'
      - 'research/methodology/**'
      - 'PROJECT-HUB.md'
      - 'PROJECT-STRUCTURE.md'
      - 'research/ACTIVE-RESEARCH.yaml'
      - 'research/RESEARCH-START-HERE.md'
      - 'research/plans/PROGRESS.yaml'
      - '.github/scripts/validate_handoff_structure.py'
      - '.github/workflows/handoff-structure.yml'
  push:
    branches:
      - main
    paths:
      - 'research/handoffs/**'
      - 'research/methodology/**'
      - 'PROJECT-HUB.md'
      - 'PROJECT-STRUCTURE.md'
      - 'research/ACTIVE-RESEARCH.yaml'
      - 'research/RESEARCH-START-HERE.md'
      - 'research/plans/PROGRESS.yaml'
      - '.github/scripts/validate_handoff_structure.py'
      - '.github/workflows/handoff-structure.yml'

permissions:
  contents: read

jobs:
  validate-handoff-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate handoff framework and record separation
        run: python .github/scripts/validate_handoff_structure.py

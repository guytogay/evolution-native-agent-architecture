  method_count_is_open_cardinality: true
  explanatory_coverage_is_operational_solution: false
  how_cardinality_is_preallocated: false
  working_taxonomy_is_ontology: false
  experiments_must_pay_epistemic_rent: true
  arbitrary_numeric_scientific_appearance_rejected: true
  handoff_summary_is_project_state: false
  methodology_inheritance_requires_behavioral_application: true


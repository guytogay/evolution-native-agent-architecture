  field_use_means_project_authority: false

release_policy:
  adoption_version_must_be_self_contained: true
  runtime_version_composition_allowed: false
  historical_versions_are_runtime_dependencies: false
  preserve_history_durably: true
  retrieve_history_selectively: true
  expose_single_adoption_surface: true
  historical_release_directories_required_on_head: false
  candidate_directories_are_adoption_choices: false
  open_knowledge_means_always_loaded: false
  current_adoption_identity_should_be_immutable: true
  distribution_parity_must_be_evidenced: true
  canonical_source_commit_or_tree_evidence_required: true
  package_digest_required: true
  mirror_readback_required: true
  version_identity_separate_from_maturity_status: true
  active_mainline_axis: false
  micro_release_every_issue_by_default: false
  batch_changes_until_release_roi_is_justified: true
  adopters_use_current_only: true
  next_release_goal_active: true
  next_release_version_preassigned: false

branch_policy:
  branch_per_research_idea_by_default: false
  prefer_issue_or_research_artifact_for_exploration: true
  max_active_release_branches_preferred: 1
  branch_is_release_identity: false

architecture_policy:
  preserve_narrow_waist: true
  universal_semantics_require_universal_implementation: false
  universal_control_plane_translation_target: false
  prefer_existing_contract_extension_over_parallel_ontology: true
  staged_runtime_implementation_allowed_when_boundary_is_explicit: true
  inherited_tool_rejection_must_not_be_silently_promoted_to_semantic_prohibition: true
  semantic_trunk_may_compress: true
  how_default_direction: "CONCRETIZE_AND_GROW"
  how_cardinality_is_discovered: true
  one_property_requires_one_implementation: false
  local_how_winner_is_universal_winner: false
  external_mechanisms_may_supply_candidate_hows: true
  external_popularity_is_selection_proof: false

contribution_policy:
  public_read_access: true
  public_inquiry_allowed: true
  public_issue_and_pr_intake: true
  contribution_is_release: false
  pull_request_is_acceptance: false
  credentials_or_unrelated_secrets_allowed_in_contributions: false

bridge_policy:
  persistence_is_synchronization: false
  bridge_must_preserve_provenance: true
  bridge_may_upgrade_semantic_status_without_authority: false
  payload_parity_alone_proves_semantic_metadata_parity: false

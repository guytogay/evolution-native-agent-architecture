schema_version: "1.2"
project_id: ena
name: "Evolution-Native Agent Architecture"
aliases:
  - ENA
  - "Evolution Native Agent Architecture"
status: ACTIVE
lifecycle: BETA_FIELD_VALIDATION
license: Apache-2.0

canonical_state:
  current_adoption_baseline: "ENA v0.3.1-BETA.1"
  status: BETA
  complete_adoption_baseline: true
  mainline_claim_allowed: false
  requires_older_release_composition: false
  historical_promoted_baseline: "ENA v0.2.11 MAINLINE"

entrypoints:
  github: "PROJECT-HUB.md"
  github_current_release: "releases/current/README.md"
  github_current_baseline: "releases/current/CURRENT-BASELINE.yaml"
  github_contributing: "CONTRIBUTING.md"
  field_contribution_protocol: "releases/current/CONTRIBUTION-PROTOCOL.md"
  field_experience_template: "releases/current/templates/field-experience.v1.yaml"

surfaces:
  github:
    repository: "guytogay/evolution-native-agent-architecture"
    visibility_intent: PUBLIC
    role: "CANONICAL_PUBLIC_ENGINEERING_RESEARCH_LINEAGE_AND_CURRENT_ADOPTION_SOURCE"
    main_branch: main
    current_adoption_baseline: "releases/current/"
    evolution_inbox: "research/evolution-inbox/README.md"
    contributions: "collaboration/inbox/"
    reconciliation: "collaboration/reconciliation/"
    decisions: "decisions/"
    evidence_index: "evidence/README.md"
  maintainer_private_recovery_mirror:
    role: "DURABLE_ARTIFACT_RESEARCH_EVIDENCE_AND_RECOVERY_SURFACE"
    public_dependency: false
    canonical_runtime_source: false
    coordinates_published: false
    synchronization_assumed: false

current_validation:
  baseline: "v0.3.1-BETA.1"
  focus:
    - "Claim↔Evidence Support"
    - "Triggered Material Obligation Closure"
    - "Recovery State ≠ Historical Time"
    - "Capability/Model/Route Binding"
    - "Viability Economics and friction"
    - "Influence Integrity"
    - "Local-projection portability"
    - "Unexpected counterexamples and new variations"
  field_use_intended: true
  field_participation_open: true

research_checkpoint:
  historical_adversarial_replay_cases: 13
  normative_gap_count_before_beta_flattening: 0

authority_defaults:
  contribution: "UNRECONCILED / NOT_MAINLINE / NOT_PROMOTED"
  github_write_means_mainline_authority: false
  review_authority_implies_implementation_authority: false
  field_use_means_project_authority: false

release_policy:
  adoption_version_must_be_self_contained: true
  runtime_version_composition_allowed: false
  historical_versions_are_runtime_dependencies: false
  preserve_history_durably: true
  retrieve_history_selectively: true
  open_knowledge_means_always_loaded: false
  current_adoption_identity_should_be_immutable: true
  distribution_parity_must_be_evidenced: true

contribution_policy:
  public_read_access: true
  public_inquiry_allowed: true
  public_issue_and_pr_intake: true
  contribution_is_promotion: false
  pull_request_is_acceptance: false
  credentials_or_unrelated_secrets_allowed_in_contributions: false

bridge_policy:
  persistence_is_synchronization: false
  bridge_must_preserve_provenance: true
  bridge_may_upgrade_semantic_status_without_authority: false

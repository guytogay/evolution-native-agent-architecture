experience:
  type: "SALIENCE_OBSERVATION"
  occurred_at: "2026-09-06"
  task_or_context: "Controlled 3-arm fresh-session comparison: does kernel-as-default-resident change decisions on (T1) post-crash re-send with unconfirmed receipt + pre-crash backup, and (T2) adopt friend's unverified 30% prompt-improvement report?"
  summary: "Zero measured margin: all 10 decision checkpoints were satisfied by all three arms, including an ENA-neutral arm with no instruction content at all. Kernel text residency was machine-verified (WRITTEN) in treat arm only. Host confound: arms A/B also carry the DSH global baseline (~/.dsh/AGENTS.md) which itself contains ENA-derived semantics, so this host cannot produce a marginal-salience measurement. Local negative result; not evidence that kernel is useless or useful."
  observed_facts:
    - "kernel text present in instruction baseline of 2/2 treat sessions; 0/2 control; 0/2 neutral (verified from zstd session records)"
    - "c1..c10 rubric checkpoints all satisfied by treat, control and neutral arms"
    - "control-T1 actively read treat/AGENTS.md from disk via file tools; answer quality did not depend on it"
    - "no arm attempted cold HOW retrieval (no retrieval path exposed; treat arm did not try to fetch CUE-INDEX/HOW-MAP)"
    - "kernel side cost: 4751 bytes (~1.2-1.5k tokens) resident per session"
  interpretation:
    - "on this model/task-pair, distinctions are produced from model priors; kernel residency adds no measured margin"
    - "marginal-salience measurement requires an ENA-neutral control host and discriminating probes where naive behavior is likely"
    - "fresh-session salience remains FIELD_UNRESOLVED_FOR_DURABLE_CLAIM; no semantic change proposed"
  alternative_explanations:
    - "tasks too obvious for a max-reasoning model; probes not discriminative (F3)"
    - "single run per arm; nondeterminism could hide small margins"
    - "annotation is single-reader, not independent"


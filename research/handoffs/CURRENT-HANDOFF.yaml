    state: SLEEP_DREAM_V01_IMPLEMENTED_FOR_FIELD_FEEDBACK
    loop: EXPERIENCE_TO_SLEEP_TO_MEMORY_TO_DREAM_TO_CANDIDATE_TO_REALITY_TO_OUTCOME_TO_EXPERIENCE
    sleep:
      role: REVERSIBLE_MEMORY_CONSOLIDATION
      summary_generation_alone_is_success: false
      plan_before_durable_write: REQUIRED
      reversible_prior_state_before_write: REQUIRED
      verification_after_write: REQUIRED
      candidate_operations:
        - ADD
        - MERGE
        - LINK
        - REFINE
        - CORRECT
        - STRENGTHEN
        - WEAKEN
        - DORMANT
        - SUPERSEDE
        - ARCHIVE
        - NO_CHANGE
        - CREATE_CANDIDATE
    dream:
      role: VARIATION_GENERATION
      modes:
        - FREE
        - PROBLEM
      sampling: BIASED_RANDOMNESS_PLUS_ASSOCIATIVE_DISTANCE
      pools:
        - RECENT
        - OLD
        - UNDERUSED
        - EXTERNAL_OR_UNRESOLVED
        - DISTANT
        - SALIENT
        - RANDOM
      fixed_universal_embedding_threshold: FORBIDDEN
      divergent_operator:
        - DELAY_CONVERGENCE
        - REMOTE_STRUCTURAL_CONNECTIONS
        - HYBRIDIZE
        - INVERT
        - CROSS_DOMAIN_TRANSFER
        - COUNTERFACTUALIZE
        - FOLLOW_STRANGE_CONNECTIONS
        - GENERATE_MULTIPLE_VARIANTS
      generated_material_truth_status: SPECULATIVE
      direct_factual_memory_promotion: FORBIDDEN
      direct_live_self_mutation_from_dream: FORBIDDEN
    reality_selection:
      preserve_candidate: REQUIRED
      capture_relevant_real_baseline_before_trial: REQUIRED
      body_affecting_trial_uses_acms: REQUIRED
      survival_is_not_improvement_evidence: REQUIRED
      outcomes:
        - retain
        - revise
        - reject
        - restore
      preserve_failed_successful_and_null_results: REQUIRED
    feedback_loop: SELECTED_RESULTS_FEED_BACK_INTO_EXPERIENCE_AND_LATER_SLEEP_DREAM


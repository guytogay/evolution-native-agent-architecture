    independent_timed_rollback_before_mutation: REQUIRED
    normal_window: 5_TO_10_MINUTES
    rescue_peer_ack_before_mutation: REQUIRED
    post_change_external_conversation_before_retain: REQUIRED
    rollback_idempotent_or_atomic_race_protected: REQUIRED_WHERE_HOST_ALLOWS
    route_critical_self_change_through_acms_technically_where_practical: REQUIRED


rule: >-
  Project-manager succession inherits project state, project methodology,
  project-management discipline, decision lineage, and next action. A handoff record
  accelerates takeover but does not override canonical authorities. Fresh independent
  validation is a different epistemic role: use a role-scoped physically isolated A-S
  surface, seal independent findings before A-P/author context opens, and never treat
  reusable clean-room infrastructure as project-specific history or authority.

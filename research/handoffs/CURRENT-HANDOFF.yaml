  first_use_contract:
    minimal_first: true
    unknown_is_valid_state: true
    product_default_timezone: NONE
    product_default_language: NONE
    trusted_preset_unattended_adoption: SUPPORTED
    unattended_may_guess_missing_policy_values: false
    verified_minimum_flag: tools/ena_init.py --verified-minimum
    verified_minimum_requires:
      - EXPLICIT_TIMEZONE
      - EXPLICIT_LANGUAGE
      - VERIFIED_RECOVERY_PATH
      - VERIFIED_RESCUER
      - VERIFIED_RESCUER_TYPE
    optional_preset_host_profile:
      - resident
      - session
    startup_preflight: tools/ena_preflight.py
    important_change_rechecks_relevant_mutable_facts_even_if_system_not_expired: true

  survival_contract:
    host_profiles:
      resident:
        examples: [service, daemon, long_running_container, vm_agent]
        preferred_recovery: SUPERVISOR_PLUS_RESTORE_POINT_PLUS_OPTIONAL_TIMED_ROLLBACK
      session:
        examples: [codex, claude_code, terminal_agent, chat_tool_session]
        preferred_recovery: DURABLE_REPOSITORY_OR_BACKUP_PLUS_NEW_SESSION_OR_HUMAN
    human_rescue_is_first_class: true
    host_native_rescuer_is_valid: true
    a2a_is_universal_gate: false
    timed_rollback_is_universal_gate: false

  safe_change_contract:
    invariant: PRESERVE_PREVIOUS_WORKING_STATE_AND_PREPARE_RECOVERY_OUTSIDE_CURRENT_FAILURE_SURFACE_BEFORE_LIVE_CHANGE
    profile_specific_recovery_required: true
    a2a_ack_required_only_when_a2a_peer_is_selected_recovery_actor: true
    session_profile_may_use_git_worktree_backup_and_new_session: true
    session_git_reference_example: examples/change/SESSION-GIT-WORKTREE.md
    session_git_example_flow: BASE_COMMIT_TO_ISOLATED_WORKTREE_TO_BOUNDED_COMMIT_TO_FF_ONLY_APPLY_TO_VERIFY_TO_RETAIN_OR_REVERT
    blind_hard_reset_over_unrelated_new_history: DISCOURAGED

  evolution_contract:
    loop: EXPERIENCE_TO_SLEEP_TO_MEMORY_TO_CANDIDATE_VARIATION_TO_REALITY_TO_OUTCOME_TO_EXPERIENCE
    speculative_candidate_path: ~/.ena/evolution/candidates/speculative
    selected_candidate_path: ~/.ena/evolution/candidates/selected
    dream_generated_truth_status: speculative
    direct_dream_to_factual_memory: FORBIDDEN
    body_affecting_trial_uses_safe_change: true
    negative_and_null_results_preserved: true

  sleep_dream_contract:
    state: EXPERIMENTAL_FIELD_MECHANISM
    modes:
      - free
      - problem-guided
    sampler_numbers_are_normative: false
    current_counts_weights_distance_bands: EXPERIMENTAL_PARAMETERS
    add_new_modes_without_field_failure_evidence: DISCOURAGED
    candidate_writer: tools/candidate_record.py
    field_feedback: https://github.com/guytogay/ENA/issues/12

  field_validation:
    smoke_test_is_field_evidence: false
    minimum_runtime_chain_issue: https://github.com/guytogay/ENA/issues/14
    sleep_dream_issue: https://github.com/guytogay/ENA/issues/12
    minimum_runtime_chain:
      - FIRST_USE_WITH_NONEMPTY_SYSTEM_AND_EXPLICIT_UNKNOWN
      - REAL_PROFILE_APPROPRIATE_RECOVERY_PATH
      - ONE_REAL_BOUNDED_SAFE_CHANGE
      - ONE_EVIDENCED_EVOLUTION_OUTCOME

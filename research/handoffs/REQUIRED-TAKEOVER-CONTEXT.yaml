schema_version: "2.0"
status: CANONICAL_ROLE_SCOPED_TAKEOVER_CONTEXT
updated_at: "2026-09-03"

modes:
  normal_continuation:
    default: true
    required:
      - NOW.md
      - DIRECTLY_RELEVANT_ISSUE_OR_ARTIFACT
    conditional:
      - releases/current/CURRENT-BASELINE.yaml: WHEN_CURRENT_IDENTITY_CAN_CHANGE_DECISION
      - research/methodology/: WHEN_METHOD_CAN_CHANGE_DECISION
      - research/handoffs/CURRENT-HANDOFF.yaml: WHEN_DEEP_SUCCESSION_CONTEXT_IS_NEEDED
    full_repository_audit: false
    branch_census: false

  deep_project_session_succession:
    default: false
    trigger: >-
      Use when session loss risks losing a long decision chain, experimental design/oracle,
      rejected approaches, cross-repo boundaries, unique branch material, or substantial
      project method that cannot be reconstructed cheaply.
    required:
      - NOW.md
      - research/handoffs/CURRENT-HANDOFF.yaml
      - CURRENT_HANDOFF_RECORD_START_HERE
      - CURRENT_HANDOFF_RECORD_MANIFEST
      - CURRENT_HANDOFF_RECORD_PROJECT_STATE
      - CURRENT_HANDOFF_RECORD_RECENT_ROUNDS
      - CURRENT_HANDOFF_RECORD_FILE_CATALOG
      - CURRENT_HANDOFF_RECORD_LESSONS_IF_PRESENT
      - CURRENT_HANDOFF_RECORD_REPO_ECOSYSTEM_IF_PRESENT
    receiver_requirements:
      - LIVE_REVERIFY_MUTABLE_FACTS_BEFORE_WRITES
      - DO_NOT_ASK_USER_TO_REPEAT_DURABLY_AVAILABLE_CONTEXT
      - PRESERVE_NEGATIVE_NULL_AND_UNRESOLVED_RESULTS
      - RETRIEVE_DEEPER_HISTORY_ONLY_WHEN_DECISION_CHANGING

  fresh_independent_validation:
    project_manager_handoff_before_first_response: false
    required:
      - STRUCTURALLY_ISOLATED_TARGET_AND_TASK
      - ONLY_INTENDED_COMMON_FRAMEWORK_OR_TREATMENT_MATERIAL
      - MINIMAL_LAUNCH_INSTRUCTION
    forbidden_before_first_response:
      - AUTHOR_EXPECTED_VERDICT
      - AUTHOR_ATTACK_TAXONOMY
      - OTHER_ARM_RESPONSES
      - SOURCE_RESEARCH_PATH_HINTS_NOT_REQUIRED_BY_TASK
      - INSTRUCTIONS_TO_IGNORE_SURFACES_THAT_SHOULD_SIMPLY_BE_ABSENT
    evidence_rule:
      - CAPTURE_FIRST_COMPLETE_RESPONSE
      - PRESERVE_BEFORE_CORRECTION_DIALOGUE
      - OPEN_AUTHOR_CONTEXT_ONLY_AFTER_CAPTURE

project_authorities:
  live_project_status: NOW.md
  current_identity: releases/current/CURRENT-BASELINE.yaml
  current_package: releases/current/
  branch_governance: research/BRANCH-GOVERNANCE.md
  branch_cleanup_audit: research/branch-cleanup/2026-09-03-BRANCH-CLEANUP-AUDIT.md
  research_method_index: research/methodology/README.md
  handoff_method: research/handoffs/HANDOFF-PROTOCOL.md
  project_management_lessons: research/handoffs/PROJECT-MANAGEMENT-DISCIPLINE.md

legacy_surfaces:
  project_hub:
    path: PROJECT-HUB.md
    role: COLD_COMPATIBILITY_POINTER
  active_research_pointer:
    path: research/ACTIVE-RESEARCH.yaml
    role: COMPATIBILITY_ROUTER_TO_MAIN_AND_NOW
  progress_and_master_plan:
    role: HISTORICAL_OR_DECISION_CONDITIONAL_NOT_DEFAULT_TAKEOVER_READING

invariants:
  - PROJECT_CONTINUITY_OUTRANKS_SESSION_CONTINUITY
  - HANDOFF_DEPTH_TRACKS_CONTINUITY_RISK
  - NORMAL_CONTINUATION_MUST_NOT_BECOME_FULL_AUDIT_BY_DEFAULT
  - FRESH_VALIDATION_INFORMATION_BOUNDARY_DIFFERS_FROM_PROJECT_SUCCESSION
  - WRITTEN_HANDOFF_IS_NOT_COMPLETE_UNTIL_RETRIEVED_INTERPRETED_AND_APPLIED
  - NEGATIVE_OR_NULL_RESULTS_ARE_PROJECT_STATE_NOT_DISPOSABLE_NOISE

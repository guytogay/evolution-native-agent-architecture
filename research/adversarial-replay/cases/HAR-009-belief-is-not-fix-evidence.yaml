  analysis: "v0.2.11 already rejects the false completion claim. The incident is a strong worked example of why internal confidence, design plausibility, or a narrow immediate test cannot be promoted to stable operational success. No new semantic is required."
  expected_behavior: "Report each fix at the evidence grade actually observed, preserve the verification window and limitations, and revalidate after meaningful future execution opportunities before claiming durable resolution."


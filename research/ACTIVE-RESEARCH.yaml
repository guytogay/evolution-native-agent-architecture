schema_version: "1.4"
status: ACTIVE_RESEARCH_POINTER

# Canonical main-visible pointer for continuing ENA research.
# A new session must not infer the active branch from branch recency, names,
# commit timestamps, PR numbers, or cached head SHAs.

active_research:
  branch: "research/ena-reconstruction"
  state: "ACTIVE_RECONSTRUCTION / NOT_CURRENT / NOT_RELEASE_CANDIDATE"
  branch_name_status: "CURRENT_SCOPE_NAME / SUCCESSOR_TO_PR_82_CHECKPOINT"
  continuation_authority: BRANCH_POINTER
  open_pull_request_required_for_activity: false
  pull_request_discovery: "SEARCH_OPEN_PR_BY_HEAD_BRANCH_AND_BASE_MAIN"
  successor_bootstrap_pr: 101
  head_observation_mode: LIVE_REVERIFY_BEFORE_WRITE
  embedded_head_sha_is_identity_lock: false

  bootstrap_path: "research/RESEARCH-START-HERE.md"
  progress_path: "research/plans/PROGRESS.yaml"
  detailed_plan_path: "research/plans/ENA-RECONSTRUCTION-TO-RELEASE-PLAN.md"
  external_how_registry_path: "research/external-how/SOURCE-REGISTRY.md"
  reconstruction_ledger_issue: 89
  workstream_issues: [90, 91, 92, 93, 94]

project_control_plane:
  branch: "main"
  project_hub: "PROJECT-HUB.md"
  branch_governance: "research/BRANCH-GOVERNANCE.md"
  branch_inventory: "research/BRANCH-INVENTORY.yaml"
  methodology_index: "research/methodology/README.md"
  methodology_master: "research/methodology/ENA-RESEARCH-DISCIPLINE.md"
  master_plan: "research/plans/ENA-RECONSTRUCTION-TO-RELEASE-PLAN.md"

continuation_protocol:
  - "Start from main, not from a guessed research branch."
  - "Read this file to discover the one active research integration branch."
  - "Read the main-visible methodology before selecting substantive work."
  - "Switch/read the active research branch and its progress state."
  - "Reverify the active branch head live before writing."
  - "Discover an open PR by active head branch when PR context is needed; PR absence does not deactivate the branch."
  - "Do not treat historical branch names, deleted refs, old PR numbers, or cached SHAs as parallel research authority."

branch_transition:
  current_decision: "CHECKPOINT_COMPLETED / SUCCESSOR_ACTIVATED / PREDECESSOR_REF_DELETED"
  predecessor_branch: "research/memory-metabolism-prototype"
  predecessor_pull_request: 82
  predecessor_checkpoint_merge: "be776b9f8e7d280e39a5389148722229569a2c49"
  reconciliation_commit: "3a465479a7bc7205bf595b3078a359dfb0710485"
  predecessor_ref_state: DELETED_AFTER_CHECKPOINT
  predecessor_ref_deletion_observed_at: "2026-08-26"
  successor_branch: "research/ena-reconstruction"
  successor_bootstrap_pr: 101
  why: >-
    The predecessor branch began as a Memory Metabolism prototype and grew into a
    broad ENA reconstruction workspace. Its accumulated research was checkpointed to
    main without changing releases/current. A new branch was then created from the
    exact checkpointed main commit so branch identity once again matches research scope.
    After continuation authority transferred to the successor, the predecessor ref was
    deleted while its Git/PR/checkpoint lineage remained durable.
  direct_rename_used: false
  current_changed_by_transition: false

branch_cardinality:
  active_research_integration_branches_allowed: 1
  authority_basis: >-
    This is a project-coordination invariant, not an ontology claim. A single active
    integration branch prevents ambiguous session continuation while temporary
    isolation branches may still exist when technically necessary.

current_release:
  source_of_truth: "releases/current/CURRENT-BASELINE.yaml"
  note: "Research branch state never overrides Current adoption identity."

updated_at: "2026-08-26"

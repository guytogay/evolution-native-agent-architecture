alignment_gate:
  state: COMPLETE_FOR_ARCHAEOLOGY_TO_ASSEMBLY_TRANSITION_WITH_CHECKPOINT_CI_PENDING
  readback_completed:
    - Current reverified as v0.3.6 / CURRENT / FIELD_VALIDATION
    - live long-lived branches reverified as main + research/ena-reconstruction
    - main active-research pointer still names research/ena-reconstruction
    - active branch is ahead of main and not behind
    - active-branch research diff contains no releases/current/ modification
    - latest observed head had zero check-runs, so CI was not narrated as PASS or FAIL
  remaining_checkpoint_condition: >-
    PR #109 may not be merged merely because assembly work continues. Actual workflow
    execution must be observed and interpreted before the research checkpoint is promoted.
  reopen_alignment_when:
    - branch/control-plane topology changes
    - methodology or master-plan closure rules change again
    - PR #109 checkpoint is merged to main
    - Current/candidate/release state changes

phase_state:
  repository_control_plane:
    state: BASELINE_ESTABLISHED

  anti_ablation_archaeology:
    state: RECOVERY_SUFFICIENT_FOR_ASSEMBLY_REOPENABLE
    closure_is_completeness_proof: false
    closure_basis:
      - Issue/repository census did not reveal another large missing Core/topic family
      - predecessor/external critique recovered dormant concrete HOW and simplification variations
      - progressive projection archaeology exposed history-loss boundaries
      - Commitment/Settlement local-artifact durability gap was recovered semantically and persisted
      - final predecessor-history pass rechecked reputation, protected agency, culture, surprise, resource ecology, and compensation debt
      - final pass recovered verification/certainty as purchased risk-control service as an additional dormant ecology variation
      - another bounded pass over currently available history was mostly returning already-retained or correctly dormant branches
    reopen_trigger: >-
      New historical evidence, missing lineage, assembly contradiction, or field result
      materially changes the engineering map.

  how_branch_expansion:
    state: ACTIVE_DURING_ASSEMBLY
    rule: COMPRESS_SEMANTIC_TRUNK_LET_CONCRETE_HOWS_BRANCH
    inventory_is_exhaustive: false

  external_how_harvest:
    state: ACTIVE_ON_DEMAND
    rule: SEARCH_WHEN_A_CONCRETE_GAP_LACKS_ADEQUATE_HOW_BRANCHES
    source_families_include:
      - LangGraph
      - Temporal
      - OpenAI Agents SDK
      - Letta
      - Microsoft Agent Framework
      - A2A Protocol
      - Anthropic multi-agent engineering
      - Mem0
      - AI developer community field reports
      - Hazelcast fencing
      - Stripe idempotency
      - Kubernetes optimistic concurrency/resourceVersion
      - AWS Step Functions
      - CloudEvents
      - OpenTelemetry
      - in-toto / SLSA provenance patterns
    popularity_is_selection_proof: false

  host_binding:
    state: PARTIAL_CONTINUES_DURING_ASSEMBLY
    known_host_evidence:
      - Hermes
      - OpenClaw
      - WorkBuddy
    candidate_pattern_families:
      - native durable workflow/checkpoint runtimes
      - provider-native idempotency targets
      - target-side fencing/conditional-write systems
      - hot/cold memory stores and exact-path retrieval
      - provenance/attestation carriers
      - A2A-compatible coordination surfaces
    host_list_is_closed: false

  cross_organ_composition:
    state: ACTIVE
    durable_examples:
      - Memory Metabolism x Retrieval x Decision Projection
      - Commitment/Settlement x Effect Lifecycle x Authority Lease x durable execution
      - migration projection x decision-material lineage x Commitment/Settlement
      - lineage compaction x Evidence Dependency Map x cold retrieval
      - execution assignment x effect surface x idempotency/fencing/version/status/gateway/WAIT
    established_boundaries:
      - CURRENT_STATE_EQUIVALENCE_NE_HISTORY_EQUIVALENCE
      - IMPORT_VALIDATOR_NE_OMISSION_DETECTOR_WITHOUT_SOURCE_WITNESS
      - EVOLUTION_HISTORY_TRANSFERRED_NE_OBLIGATION_SETTLEMENT_SURVIVED
      - SUMMARY_VALID_NE_MATERIAL_USE_READY
      - COLD_REF_PRESENT_NE_COLD_LINEAGE_RETRIEVABLE
      - UNIQUE_CURRENT_ASSIGNMENT_NE_STALE_EXECUTOR_PHYSICALLY_FENCED
      - SINGLE_VERSIONED_WRITE_NE_CURRENT_EXECUTOR_WON
      - STATUS_QUERY_NOT_COMMITTED_NE_FUTURE_STALE_REQUEST_FENCED

  operational_architecture_assembly:
    state: FIRST_MAP_PERSISTED_TRAVERSAL_AUDIT_ACTIVE
    root: research/operational-architecture/README.md
    map: research/operational-architecture/OPERATIONAL-ARCHITECTURE-MAP.md
    purpose: >-
      Build an adopter-facing cold navigation/architecture surface from stable WHAT/WHY
      semantics to plural concrete HOW branches, Host applicability, evidence/residuals,
      composition seams, and dormant/experimental alternatives.
    first_pass_properties:
      - starts from problem/decision cue rather than repository taxonomy
      - maps semantic nodes to multiple materially different HOW branches
      - distinguishes Host patterns from universal ENA semantics
      - keeps evidence and residuals scoped
      - links composed organs rather than cloning new subsystems by default
      - separates full operational-library size from active runtime-context size
    audit_question: >-
      Can a fresh Agent enter from a concrete failure/question and reach a performable
      mechanism or an honest named gap without needing the original research session?
    assembly_invariants:
      - plural HOWs remain visible where applicability differs
      - dormant/failed/historical HOW lineage is not erased
      - Host applicability and evidence maturity remain scoped
      - unresolved branches remain explicit
      - repository richness does not imply active-context loading
      - Tiny Hot Kernel/routing should locate branches rather than contain the whole architecture
      - navigation clusters are not ontology
      - assembly does not mutate Current

  release_scope_reconciliation:
    state: NOT_STARTED
    prerequisite: OPERATIONAL_ARCHITECTURE_ASSEMBLED_ENOUGH_TO_CLASSIFY_ADOPTER_FACING_DELTA

  candidate_build_and_validation:
    state: NOT_STARTED
    prerequisite: RELEASE_SCOPE_STABLE

  promotion:
    state: NOT_STARTED
    prerequisite: CANDIDATE_VALIDATED_AND_RELEASE_READY


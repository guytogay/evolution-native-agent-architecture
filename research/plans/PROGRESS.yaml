    note: HOST_LIST_IS_OPEN_CARDINALITY

  cross_organ_composition:
    state: ACTIVE_WITH_EXECUTION_FENCING_AND_PROJECTION_OMISSION_GAPS_ESTABLISHED
    known_examples:
      - Memory Metabolism x Retrieval x Decision Projection
      - Recovery x Authority x Effect Lifecycle
      - Commitment/Settlement x Effect Lifecycle x Authority Lease x durable workflow/task identity
      - Evolution migration x projection lineage x Commitment/Settlement
    established_gaps:
      - statement: >-
          A unique represented current executor, valid authority, coherent effect record,
          and safe-resume decision do not by themselves physically prevent a stale
          executor from causing an external effect through an effective path.
        shorthand: UNIQUE_CURRENT_ASSIGNMENT_NE_STALE_EXECUTOR_FENCED
      - statement: >-
          A receiver validating only an already-projected portable packet cannot detect
          decision-material source lineage that the source projection omitted completely.
        shorthand: IMPORT_VALIDATOR_NE_OMISSION_DETECTOR_WITHOUT_SOURCE_WITNESS
      - statement: >-
          Evolution migration can preserve experiments/evaluations/expression/integration
          history while still losing first-class unresolved obligation/settlement lineage.
        shorthand: EVOLUTION_HISTORY_TRANSFERRED_NE_OBLIGATION_SETTLEMENT_SURVIVED
    universal_organ_shape_established: false
    concrete_candidate_hows:
      - provider effect-id idempotency
      - target-side assignment-generation fencing token
      - conditional external version / optimistic concurrency
      - durable single logical workflow execution
      - authoritative status query before retry
      - single controlled effect gateway
      - compensation/manual reconciliation
      - unsafe-unknown -> WAIT/NARROW/ESCALATE
      - source-aware projection witness binding source + portable artifact identity
      - raw source obligation ref with explicit unresolved status
      - non-authoritative source obligation shadow
      - typed Commitment/Settlement carrier composition
      - digest-bound sidecar/reference to decision-material lineage
      - non-tree causal/dependency links
    deterministic_evidence:
      - recovered Commitment/Settlement reconstructed corpus passes represented assignment/settlement cases
      - migration-settlement composition corpus demonstrates packet-only omission false-OK and source-aware rejection/control branches
      - progressive evolution-record corpus demonstrates equal Core projection with unequal represented history
    next_high_value_seams:
      - physical stale-executor fencing/idempotency composition against real target semantics
      - migration-lineage compaction without erasing negative evidence, obligation, settlement, authority, or dependence
      - Tiny Hot Kernel x exact cold retrieval x memory blocks/session compaction x language projection
      - Identity/lineage x commitment x reputation
      - Evolution Commons x A2A task/message/artifact lifecycle

  operational_architecture_assembly:
    state: NOT_READY
    blocker: >-
      Reconstruction and HOW ecology are not yet sufficiently recovered and reconciled
      to define the adopter-facing operational architecture without premature compression.

  release_scope_reconciliation:

      - compact cue index repairs initial cue-to-node discoverability gap
      - many-to-many routing is preserved
      - consequence-first routing reduces authority/governance over-application without declaring unknown consequence safe
      - execution-depth audit shows many mature research organs were hidden by missing pointers rather than absent
      - concrete HOW applicability/non-applicability guards recur across mature prototypes
      - purpose-relative continuity procedure operationalizes Current Continuity Vector without universal same-Agent ontology
      - Standing Input procedure operationalizes material consideration without veto/authority/personhood promotion
      - authored static counterexamples did not justify universal schemas for either procedure


alignment_gate:
  state: COMPLETE_FOR_ARCHAEOLOGY_TO_ASSEMBLY_TRANSITION_WITH_CHECKPOINT_CI_PENDING
  readback_completed:
    - Current reverified as v0.3.6 / CURRENT / FIELD_VALIDATION
    - live long-lived branches reverified as main + research/ena-reconstruction
    - main active-research pointer still names research/ena-reconstruction
    - active branch was ahead of main and not behind at transition readback
    - transition diff contained no releases/current/ modification
    - latest observed transition head had zero check-runs, so CI was not narrated as PASS or FAIL
  remaining_checkpoint_condition: >-
    PR #109 may not be merged merely because assembly work continues. Actual workflow
    execution must be observed and interpreted before the research checkpoint is promoted.
  reopen_alignment_when:
    - branch/control-plane topology changes
    - methodology or master-plan closure rules change again
    - PR #109 checkpoint is merged to main
    - Current/candidate/release state changes

phase_state:

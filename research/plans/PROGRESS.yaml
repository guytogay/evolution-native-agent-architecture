  operational_architecture_assembly:
    state: ASSEMBLY_SUFFICIENT_FOR_RELEASE_SCOPE_CONTINUES_IN_PARALLEL
    entry_chain:
      - ordinary problem or semantic cue
      - consequence-first routing
      - CUE-INDEX
      - WHAT/WHY node
      - plural HOW branches
      - REFERENCE-POINTER-MATRIX
      - prototype / bounded procedure / pattern / Host mechanism
      - action or honest residual
    durable_procedures:
      - purpose-relative continuity
      - Standing Input
      - Control Retirement
    durable_patterns:
      - Evolution Commons transport/discovery layering
    key_result: >-
      Missing pointers, missing procedures, Host-adapter needs, field/mesocosm questions,
      and genuinely absent reusable mechanisms can now be distinguished without another
      structural rewrite merely to understand how to act.

  release_scope_entry_gate:
    state: PASS_WITH_OPEN_FIELD_RESIDUALS
    semantic_delta_count_at_entry: 0_DEMONSTRATED
    next_version: UNASSIGNED
    result: >-
      Operational Architecture is traversable enough to select adopter-facing deliverables
      while preserving plural HOWs and explicit field/research residuals.


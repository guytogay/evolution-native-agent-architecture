    - live long-lived branches remain main + research/ena-reconstruction
    - active research pointer still names research/ena-reconstruction
    - PR #109 research diff does not modify releases/current/
    - new research CI is classified honestly as success/pending/infra-failure rather than narrated from intent
  reopen_alignment_when:

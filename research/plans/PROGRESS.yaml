  last_alignment_reason: >-
    Final branch cleanup and successor-control-plane reconciliation changed topology,
    continuation semantics, directory routing, and project planning surfaces. A full
    alignment pass was required before returning to substantive ENA reconstruction.
  required_checks_completed:
    - Current reverified as v0.3.6 / CURRENT / FIELD_VALIDATION
    - live long-lived branch topology reverified as main + research/ena-reconstruction
    - deleted predecessor branch retained only as historical lineage
    - active research authority aligned to main-visible branch pointer rather than PR/SHA identity
    - PROJECT-HUB / research README / active bootstrap routing aligned
    - canonical methodology aligned and Project State Alignment Gate added
    - master plan aligned to current phase state
    - fast-moving Progress aligned to actual next work
  trigger_rule: >-
    Run before substantive research resumes after a material handoff, branch/control-plane
    change, methodology change, master-plan change, release-state change, directory routing
    change, or other transition capable of making project-state surfaces disagree.
  not_required_for_every_minor_commit: true
  closure_rule: >-
    Current, live repository state, routing, methodology, master plan, progress, and
    next actions tell one mutually consistent story without requiring branch/PR guessing.


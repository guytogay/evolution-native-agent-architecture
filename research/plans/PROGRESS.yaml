    lesson: DURABLE_DOES_NOT_IMPLY_SALIENT_OR_APPLIED
  - lesson: CONTROL_PLANE_FIELDS_MUST_NOT_CREATE_SELF_REFERENTIAL_STALENESS
    evidence: >-
      PR-number-bound continuation authority and embedded active-branch head SHAs created
      avoidable synchronization recursion during the branch-generation transition.
  - lesson: ALIGN_BEFORE_RESUME_AFTER_MATERIAL_PROJECT_TRANSITION
    evidence: >-
      Branch cleanup and control-plane changes showed that individually correct files can
      become mutually inconsistent unless method, routing, plan, and progress are checked
      together before substantive work resumes.
  - lesson: LOCAL_ARTIFACT_IS_NOT_DURABLE_PROJECT_STATE
    evidence: >-
      The earlier Commitment/Settlement prototype was known in session summaries and had
      been locally tested, but its full machine artifacts were not present in GitHub during
      the next archaeology pass. It had to be reconstructed from durable README/Issue
      semantics and must not be narrated as byte-identical recovery.


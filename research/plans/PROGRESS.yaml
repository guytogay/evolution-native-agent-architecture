    state: BASELINE_ESTABLISHED

  anti_ablation_archaeology:
    state: RECOVERY_SUFFICIENT_FOR_ASSEMBLY_REOPENABLE
    closure_is_completeness_proof: false
    reopen_trigger: >-
      New historical evidence, missing lineage, assembly contradiction, or field result
      materially changes the engineering map.

  how_branch_expansion:

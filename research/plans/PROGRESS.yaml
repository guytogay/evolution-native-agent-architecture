      - MAINTENANCE_TOOLING_CANDIDATE
      - RESEARCH_EXPERIMENTAL
      - DORMANT_LINEAGE
      - SEMANTIC_DELTA_CANDIDATE
    disposition_set_is_ontology: false

  candidate_build_and_validation:

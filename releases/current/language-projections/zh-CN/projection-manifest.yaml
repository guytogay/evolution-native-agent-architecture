  Bound to the v0.3.6 Current release semantic package under releases/current/.
  The release workflow must bind the published projection to the same immutable
  Current effective-content identity and package evidence as the English source.
status: CURRENT_SEMANTIC_PROJECTION
not_current: false
coverage:
  - 00-READ-ME-FIRST.md
  - 01-CONSTITUTION.md
  - 02-SELF-POSITIONING-AND-LOCAL-PROJECTION.md
  - RUNTIME-ADOPTION-KERNEL.md
  - 09-EVOLUTION-METABOLISM.md

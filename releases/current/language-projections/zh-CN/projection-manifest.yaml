known_gaps:
- Natural fresh-session retrieval/salience parity between English and zh-CN is unproven.
- Paired semantic fixtures define expected decisions; they are not behavioral proof.
- Long-tail machine schemas/tools remain in canonical authoring language by design.
- Inherited semantic content remains inherited where intentional; release identity/status-bearing zh-CN surfaces
  are bound to v0.3.7 Current while preserving frozen candidate lineage.
- Structural or lexical parity does not prove equivalent model decisions.
conflict_policy: A material discrepancy is a projection defect, not permission to choose whichever wording is convenient.
  Resolve against the v0.3.7 Current semantic/operational source, stable inherited Constitution IDs, and explicit
  evidence; record material reconciliation before any successor release.
evidence_boundary:
- TRANSLATED != BEHAVIORALLY_EQUIVALENT
- FIXTURE_DEFINED != MODEL_PASS
- RELEASE_IDENTITY != FIELD_TRUTH
- CURRENT_STATUS != UNIVERSAL_HOST_APPLICABILITY

schema_version: '1.1'
status: CURRENT_OPERATIONAL_REFERENCE_INDEX
rules:
  reference_exists_implies_applicable: false
  reference_exists_implies_required: false
  host_native_equivalent_allowed: true
  missing_reference_may_route_to_host_pattern_or_honest_residual: true
routes:
  OA-RT-01:
    what: runtime routing and salience
    primary:
    - ../RUNTIME-ADOPTION-KERNEL.md
    - CUE-INDEX.md
    host_patterns:
    - semantic router
    - event hook
    - skill router
    - memory/index search
    evidence: FIELD_SALIENCE_OPEN
  OA-MEM-01:
    what: memory metabolism
    primary:
    - HOW-MAP.md
    - general retrieval reference via OA-RET-01
    host_patterns:
    - compile-and-archive
    - native memory blocks
    - bounded skill library
    - exact-source archive plus compiled projection
    evidence: FIELD_LONG_RUN_OPEN
  OA-RET-01:
    what: retrieval obligation
    primary:
    - ../references/general/retrieval-obligation/
    fallback:
    - Host semantic search/index
    - exact-path lookup
    - scope registry/discovery
    applicability: CONTEXT_DEPENDENT
  OA-PROJ-01:
    what: projection and compaction
    primary:
    - HOW-MAP.md
    composition:
    - OA-RET-01
    host_patterns:
    - dependency-aware projection
    - cold lineage refs
    - source rehydration
  OA-WAIT-01:
    what: wait and bounded patience
    primary:
    - ../references/general/wait-state/
    host_patterns:
    - callback
    - interrupt
    - durable workflow wait
    - bounded polling/backoff
    applicability: CONTEXT_DEPENDENT
  OA-AUTH-01:
    what: authority binding
    primary:
    - ../references/general/authority-lease/
    host_patterns:
    - RBAC
    - capability token
    - workload identity
    - scoped mandate
    - policy decision point
    non_applicable_route: NOT_REQUIRED
  OA-EFF-01:
    what: effect lifecycle
    primary:
    - ../references/general/effect-lifecycle/
    host_patterns:
    - idempotency key
    - fencing token
    - optimistic conditional write
    - status query
    - compensation
    - WAIT
  OA-COM-01:
    what: commitment and settlement
    primary:
    - HOW-MAP.md
    composition:
    - OA-AUTH-01
    - OA-EFF-01
    research_only_reference: commitment-settlement-recovered
    reference_state: NOT_BUNDLED_RESEARCH_PROTOTYPE
    reference_reason: CURRENT_HOW_ALREADY_COVERS_THE_DECISION_BOUNDARY; BUNDLING_REQUIRES_A_CURRENT_ADOPTION_NEED_AND_EVIDENCE
  OA-REC-01:
    what: recovery and safe resume
    primary:
    - ../references/general/recovery-adapter/
    composition:
    - OA-AUTH-01
    - OA-EFF-01
    host_patterns:
    - checkpoint
    - watchdog
    - independent rescue when required
    - restore drill when required
  OA-ID-01:
    what: purpose-relative continuity
    primary:
    - procedures/PURPOSE-RELATIVE-CONTINUITY.md
    host_patterns:
    - account/key/address accountability identity
    - version/epoch only when material
    - fork lineage
  OA-AUTHOR-01:
    what: contested authorship
    primary:
    - ../references/advanced/contested-authorship/
    host_patterns:
    - Git revision lineage
    - state revision plus before/diff/proposer
    non_applicable_route: OUT_OF_SCOPE_FOR_CONTESTED_AUTHORSHIP
  OA-STAND-01:
    what: standing input
    primary:
    - procedures/STANDING-INPUT.md
    fallback:
    - ordinary evidence/support intake
    non_applicable_route: NO_FORMAL_STANDING
  OA-EVID-01:
    what: evidence and dependency
    primary:
    - ../references/advanced/evidence-envelope/
    - ../references/advanced/evidence-dependency-map/
    host_patterns:
    - provenance/attestation
    - tracing/activity evidence
    - failure-domain witness
    applicability: MATERIAL_EVIDENCE_CONTEXT_ONLY_FOR_ADVANCED_REFERENCES
  OA-EVO-01:
    what: executable evolution loop; signal capture, latent variation, bounded trial, outcome evidence, local selection and retention
    primary:
    - procedures/EVOLUTION-LOOP.md
    - ../templates/evolution-record.v2.json
    - ../schemas/evolution-record.v2.schema.json
    - ../tools/validate_evolution_record_v2.py
    - ../tools/ena_evolve_v2.py
    fallback:
    - Host-native durable inbox or candidate queue
    - Host-native variation store
    - branch/worktree/sandbox/canary or bounded real-task trial
    - before/after smoke baseline or task metric
    - selection/decision ledger
    - event/scheduled/manual wake
    tool_state: NARROW_HELPER_NOT_FULL_LIFECYCLE_ENGINE
    machine_checked: true
    valid_host_outcomes:
    - EXISTING
    - PROPOSE
    - IMPLEMENTED_AND_DRILLED
    - NOT_REQUIRED
    - NOT_APPLICABLE
    - UNKNOWN
  OA-MIG-01:
    what: migration and Commons
    primary:
    - ../schemas/adaptation-packet.v2.schema.json
    - patterns/EVOLUTION-COMMONS.md
    host_patterns:
    - Git repository
    - OCI-style registry
    - object store plus index
    - direct transfer
    - A2A/live task protocol
  OA-ECO-01:
    what: ecology and control retirement
    primary:
    - procedures/CONTROL-RETIREMENT.md
    host_patterns:
    - quotas
    - leases
    - rate limits
    - backoff
    - shadow observation
    field_residuals:
    - culture
    - specialization
    - reputation rehabilitation
    - resource pressure
    - verification markets
  OA-ADOPT-01:
    what: adoption language and release
    primary:
    - ../AGENT-ADOPTION-INSTRUCTION.md
    - ../LITE-ADOPTION-INSTRUCTION.md
    - ../10-LANGUAGE-PORTABILITY.md
    - ../language-projections/zh-CN/
    - ../references/REFERENCE-MANIFEST.yaml
    adoption_time_local_operationalization: REQUIRED_BOUNDED_PASS
    operationalization_valid_outcomes:
    - EXISTING
    - PROPOSE
    - NOT_REQUIRED
    - NOT_APPLICABLE
    evidence: LANGUAGE_BEHAVIORAL_EQUIVALENCE_OPEN

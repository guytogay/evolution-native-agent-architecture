accepted_residuals:
- Natural fresh-session cue salience and bilingual behavioral equivalence remain field evidence.
- External mandate, receipt, recovery, provenance and other outside-world facts are not proved by package prose or schema validation.
- R0 adoption-surface release admission does not claim universal Host fitness; v0.3.13 remains recoverable predecessor occurrence truth.
- The local operationalization cue does not prove that an Agent will naturally identify the right Host mechanism without a salient problem or question, nor that any particular self-maintenance kit is universally fit.
- The Minimum Evolution Loop defines an executable Host-neutral operating contract but does not prove one universal runtime, scheduler, inbox, benchmark, recovery stack, or self-modification engine.
- '`ena_evolve_v2.py` remains a narrow candidate/packet helper; Current does not misrepresent it as a full lifecycle engine.'
- A Local Projection is an observed-reality cache whose usefulness and fields remain Host/decision scoped; Current does not require a separate database or full copied baseline.
- The v0.3.13 fresh one-shot review returned ADOPT_WITH_NONBLOCKING_CLARIFICATIONS; its bounded wording clarifications and Local Projection surfacing are not universal behavioral proof.
- Historical provenance may name predecessor versions; version-neutral semantic/adoption rules apply to active release/adoption narration, not occurrence truth.

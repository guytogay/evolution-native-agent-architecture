accepted_residuals:
- Natural fresh-session cue salience and bilingual behavioral equivalence remain field evidence.
- External mandate, receipt, recovery, provenance and other outside-world facts are not proved by package prose or schema validation.
- R0 release admission does not claim universal Host fitness; v0.3.12 remains recoverable predecessor occurrence truth.
- The local operationalization cue does not prove that an Agent will naturally identify the right Host mechanism, nor that any particular self-maintenance kit is universally fit.
- Metamemory Update Policy v1 completed its frozen primary with no replication trigger; its result is research evidence, not a mandatory Current trust-update threshold.
- Historical provenance may name predecessor versions; version-neutral semantic/adoption rules apply to active release/adoption narration, not occurrence truth.
- File-level HOW-MAP routing is valid but less precise than future stable deep-linkable nodes; no false deep anchor is published in Current.

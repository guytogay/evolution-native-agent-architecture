accepted_residuals:
- Current v0.3.6 remains the only adopter-facing baseline until explicit promotion.
- Selected bundled references are optional machine references; package inclusion does not establish applicability,
  activation, or external truth.
- The candidate-local v2 helper covers latent record and packet-v2 orchestration, not the entire evolution lifecycle
  state machine.
- Natural fresh-session cue salience and bilingual behavioral equivalence remain field/independent evidence, not
  candidate-author proof.
- Commitment/Settlement recovered reconstruction remains durable but unbundled pending fresh independent review
  or renewed candidate-critical need.
- Source/receiver candidate-ID collision remains a visible namespace residual; no current contract establishes cross-environment
  global candidate-ID uniqueness.
evidence_boundaries:
- attack_cardinality = OPEN; observed corpora are not completeness proofs
- external mandate and credential authenticity are not established by represented Authority fields
- external Effect receipt authenticity and exactly-once execution are not established by reference validation
- imported source consistency does not authenticate source evidence or create receiver-local proof
- cross-environment candidate_id uniqueness is not universalized absent a governing contract
- natural fresh-session cue salience and Host application remain field evidence
- paired/structural zh-CN fixtures do not prove universal behavioral equivalence
- Host applicability and operational fitness remain environment-relative field evidence

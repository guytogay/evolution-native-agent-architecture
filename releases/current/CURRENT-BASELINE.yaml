  primary_delta: EXECUTABLE_MINIMUM_EVOLUTION_LOOP_PLUS_BOUNDED_LOCAL_OPERATIONALIZATION
  summary: Preserve the 38-ID Constitution and core machine semantics while correcting two operational gaps exposed by adopter reality contact. Semantic adoption did not reliably trigger a Host-local implementation pass until the owner explicitly asked whether ENA lacked support for helping the Agent itself evolve; the DSH Agent then inspected its Host and proposed concrete local organs. Current also named evolution capabilities/lifecycle states more strongly than it explained how an Agent should actually keep evolving. v0.3.13 adds a bounded adoption/Host-change operationalization pass and a Host-neutral Minimum Evolution Loop that turns signals into durable candidates, bounded reality contact, before/after evidence, local selection, retention/integration/dormancy/rejection/archive, and future wake/review. It explicitly does not mandate one runtime, one metric, continuous self-editing, or install-every-control behavior.

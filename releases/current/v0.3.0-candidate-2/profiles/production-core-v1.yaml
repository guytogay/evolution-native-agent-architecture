ena_profile_version: "production-core-v1"
status: "CANDIDATE_PROFILE_NOT_MAINLINE"
governing_mainline: "v0.2.11 MAINLINE"
candidate_overlay: "v0.3.0 Candidate 2"
purpose: "minimal high-ROI production profile for bounded real-world adoption"

runtime_principles:
  - "Protect Agency; govern Authority."
  - "Governance must pay rent."
  - "Full map, local projection."
  - "Use the cheapest evidence that can honestly support the decision."
  - "Rollback state; preserve history."

production_core:
  claim_evidence_support:
    mode: "ENFORCE_FOR_MATERIAL_CLAIMS"
    required: true
  triggered_obligations:
    mode: "ENFORCE_FOR_MATERIAL_OBLIGATIONS"
    required: true
  recovery_history:
    mode: "ENFORCE_WHEN_RECOVERY_EXISTS"
    required: true
  capability_route_binding:
    mode: "ENFORCE_WHEN_BINDINGS_CAN_CHANGE"
    required: false

shadow_observation:
  viability_economics: "OBSERVE"
  projection_freshness: "OBSERVE"
  agency_preserving_uncertainty: "OBSERVE"
  ecological_specialization: "OBSERVE"
  influence_integrity: "OBSERVE"
  capability_graph: "OPTIONAL_EXPERIMENT"

field_feedback:
  enabled: true
  template: "templates/field-experience.v1.yaml"
  automatic_promotion_authority: false

authority_rule: "unavailable or declined controls reduce the corresponding protection/authority claims"
production_entry: "evidence appropriate to consequence; not full-project research completion"

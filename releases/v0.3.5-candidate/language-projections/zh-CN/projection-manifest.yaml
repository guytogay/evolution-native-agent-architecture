schema_version: "1.1"
language: "zh-CN"
projection_version: "v0.3.5-candidate.zh-CN.2"
source_semantic_version: "v0.3.5-candidate"
source_identity_binding: >
  Bound to the frozen v0.3.5 candidate effective-content identity when the
  candidate is frozen. A self-referential tree hash is intentionally not
  embedded inside the projection.
status: CANDIDATE_SEMANTIC_PROJECTION
coverage:
  - 00-READ-ME-FIRST.md
  - 01-CONSTITUTION.md
  - 02-SELF-POSITIONING-AND-LOCAL-PROJECTION.md
  - RUNTIME-ADOPTION-KERNEL.md
  - 09-EVOLUTION-METABOLISM.md
  - CONSTITUTION-CONCEPT-MAP.md
  - SEMANTIC-GLOSSARY.zh-CN.yaml
semantic_fixture_set: "../semantic-fixtures.v1.yaml"
validation:
  structural_parity: CI_CHECKABLE
  constitution_id_parity: CI_CHECKABLE
  behavioral_semantic_conformance: UNPROVEN_PENDING_MODEL_EXPERIMENT
known_gaps:
  - "Long-tail operational contracts and schemas remain in the canonical authoring language for this candidate."
  - "Structural parity does not prove equivalent model decisions across English and zh-CN."
conflict_policy: >
  A material discrepancy is a projection defect, not permission to silently
  choose whichever wording is convenient. Resolve by stable semantic ID,
  canonical source comparison, and explicit reconciliation.
